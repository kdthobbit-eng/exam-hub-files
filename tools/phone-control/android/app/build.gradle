plugins { id 'com.android.application' }
android {
    namespace 'com.examhub.phone'
    compileSdk 34
    defaultConfig {
        applicationId 'com.examhub.phone'
        minSdk 24
        targetSdk 34
        versionCode (System.getenv('BUILD_NUM') ? System.getenv('BUILD_NUM').toInteger() : 1)
        versionName "1." + (System.getenv('BUILD_NUM') ?: '0')
    }
    buildFeatures { buildConfig true }
    signingConfigs { fixed { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release { signingConfig signingConfigs.fixed; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.squareup.okhttp3:okhttp:4.12.0' }
