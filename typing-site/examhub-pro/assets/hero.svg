<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" role="img" aria-label="Student practising typing test on a computer">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb37a"/><stop offset="1" stop-color="#e8590c"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#111"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".18"/></filter>
  </defs>
  <!-- background blob -->
  <path d="M86 120c40-70 150-96 236-74 92 24 170 70 196 150 28 86-14 182-102 222-86 40-200 40-276-8C62 362 30 280 44 214c6-34 22-64 42-94z" fill="#f6dcc6"/>
  <circle cx="462" cy="92" r="34" fill="url(#g1)" opacity=".9"/>
  <!-- desk -->
  <rect x="40" y="372" width="480" height="16" rx="8" fill="#111"/>
  <rect x="80" y="388" width="14" height="70" rx="5" fill="#111"/>
  <rect x="466" y="388" width="14" height="70" rx="5" fill="#111"/>
  <!-- monitor -->
  <g filter="url(#sh)">
    <rect x="178" y="138" width="270" height="182" rx="16" fill="url(#g2)"/>
    <rect x="190" y="150" width="246" height="150" rx="9" fill="#fbfaf6"/>
    <rect x="300" y="320" width="26" height="36" fill="#222"/>
    <rect x="262" y="352" width="102" height="12" rx="6" fill="#222"/>
  </g>
  <!-- screen content -->
  <rect x="204" y="164" width="120" height="10" rx="5" fill="#111"/>
  <rect x="380" y="161" width="44" height="16" rx="6" fill="#e8590c"/>
  <text x="402" y="173" font-family="Inter,Arial" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">09:42</text>
  <rect x="204" y="186" width="218" height="6" rx="3" fill="#d8d2c4"/>
  <rect x="204" y="198" width="196" height="6" rx="3" fill="#d8d2c4"/>
  <rect x="204" y="210" width="208" height="6" rx="3" fill="#d8d2c4"/>
  <rect x="240" y="198" width="34" height="6" rx="3" fill="#ffb37a"/>
  <rect x="204" y="228" width="218" height="56" rx="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="214" y="240" width="150" height="6" rx="3" fill="#111" opacity=".75"/>
  <rect x="214" y="252" width="120" height="6" rx="3" fill="#111" opacity=".75"/>
  <rect x="337" y="249" width="2.5" height="12" fill="#e8590c"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
