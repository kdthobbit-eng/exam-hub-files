    <rect width="190" height="30" rx="7" fill="#2b2b2b"/>
    <g fill="#4a4a4a">
      <rect x="8" y="6" width="14" height="8" rx="2"/><rect x="26" y="6" width="14" height="8" rx="2"/><rect x="44" y="6" width="14" height="8" rx="2"/><rect x="62" y="6" width="14" height="8" rx="2"/><rect x="80" y="6" width="14" height="8" rx="2"/><rect x="98" y="6" width="14" height="8" rx="2"/><rect x="116" y="6" width="14" height="8" rx="2"/><rect x="134" y="6" width="14" height="8" rx="2"/><rect x="152" y="6" width="30" height="8" rx="2"/>
      <rect x="8" y="17" width="20" height="8" rx="2"/><rect x="32" y="17" width="110" height="8" rx="2"/><rect x="146" y="17" width="36" height="8" rx="2"/>
    </g>
  </g>
  <!-- student -->
  <g>
    <path d="M70 372c0-60 18-104 58-120 26-10 54-6 72 12 18 18 24 54 24 108z" fill="#111"/>
    <path d="M118 262l60 72 34-6-48-82z" fill="#111"/>
    <path d="M176 330c12-6 26-6 36 2" stroke="#c88a5e" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="140" cy="210" r="34" fill="#c88a5e"/>
    <path d="M106 206c0-26 18-44 40-44 20 0 34 12 36 30-10-8-26-10-40-6-14 4-24 12-36 20z" fill="#1d1d1d"/>
    <path d="M160 214c4 2 8 2 12 0" stroke="#7a4b2c" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="164" cy="204" r="2.6" fill="#1d1d1d"/>
    <rect x="128" y="236" width="24" height="18" rx="6" fill="#c88a5e"/>
  </g>
  <!-- floating cards -->
  <g filter="url(#sh)">
    <rect x="392" y="236" width="138" height="66" rx="14" fill="#fff"/>
    <text x="406" y="258" font-family="Inter,Arial" font-size="11" fill="#6b6b6b">Net Speed</text>
    <text x="406" y="286" font-family="Inter,Arial" font-size="24" font-weight="800" fill="#111">42 <tspan font-size="12" font-weight="600" fill="#6b6b6b">WPM</tspan></text>
    <circle cx="506" cy="270" r="13" fill="#e3f5ec"/><path d="M500 270l4 4 8-8" stroke="#12805c" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </g>
  <g filter="url(#sh)">
    <rect x="28" y="66" width="150" height="58" rx="14" fill="#111"/>
    <text x="44" y="88" font-family="Inter,Arial" font-size="11" fill="#cfcfcf">Accuracy</text>
    <text x="44" y="112" font-family="Inter,Arial" font-size="22" font-weight="800" fill="#fff">97.6%</text>
    <rect x="124" y="98" width="40" height="8" rx="4" fill="#333"/><rect x="124" y="98" width="34" height="8" rx="4" fill="#ffb37a"/>
  </g>
  <g filter="url(#sh)">
    <rect x="300" y="40" width="128" height="44" rx="22" fill="#fff"/>
    <text x="364" y="67" font-family="Noto Sans Devanagari,Arial" font-size="15" font-weight="700" fill="#e8590c" text-anchor="middle">क ख ग  A B C</text>
  </g>
  <!-- sparkles -->
  <path d="M500 168l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#111"/>
  <path d="M54 300l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#e8590c"/>
