:root{--b:#015a3e;--bs:#e0efe9;--a:#ec8516;--ok:#1d8a4b;--bad:#c9372c;--bg:#f2f5f4;--s:#fff;--l:#dfe7e4;--m:#5f6e6a;--ink:#13201c}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Mukta,sans-serif;background:var(--bg);color:var(--ink)}
button,a{font:inherit;cursor:pointer}button{border:0;background:none;color:inherit}a{color:inherit;text-decoration:none}
.top{background:var(--b);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.top img{width:34px;height:34px;border-radius:9px;background:#fff}.top b{flex:1;font-weight:700}
.timer{font-weight:700;font-size:20px;color:#ffd29e;font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding:14px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.links a{background:var(--s);border:1px solid var(--l);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:600;color:var(--b)}
.card{background:var(--s);border:1px solid var(--l);border-radius:16px;padding:16px;margin-bottom:12px}
.lay{display:grid;grid-template-columns:1fr 270px;gap:14px;align-items:start}@media(max-width:800px){.lay{grid-template-columns:1fr}}
.q{font-size:19px;font-weight:600;margin:6px 0 12px}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:12px;border:1.5px solid var(--l);border-radius:12px;background:var(--s);margin-bottom:8px}
.opt .k{width:28px;height:28px;border-radius:8px;background:#eef2f0;display:grid;place-items:center;font-weight:700;flex:none}
.opt.sel{border-color:var(--b);background:var(--bs)}.opt.sel .k{background:var(--b);color:#fff}
.opt.r{border-color:var(--ok);background:#e6f4ec}.opt.w{border-color:var(--bad);background:#fbeceb}
.pal{display:flex;flex-wrap:wrap;gap:5px}.pal button{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--l);font-weight:700;background:var(--s);font-size:13px}
.pal .a{background:var(--b);border-color:var(--b);color:#fff}.pal .c{outline:2px solid var(--a)}
.btn{background:var(--b);color:#fff;border-radius:12px;padding:11px 16px;font-weight:700}.btn.alt{background:var(--a)}.btn.g{background:var(--s);color:var(--ink);border:1.5px solid var(--l)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.stats div{background:#eef2f0;border-radius:12px;padding:8px}.stats b{display:block;font-size:22px}
.ex{background:var(--bs);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:15px}.src{color:var(--m);font-size:14px}
.ctx{background:#f4f8f6;border:1.5px dashed var(--b);border-radius:12px;padding:10px 12px;white-space:pre-line;font-size:15px;max-height:300px;overflow:auto}.ex{white-space:pre-line}
.intro h1{margin:0 0 6px;font-size:24px;color:var(--b)}

const D={"meta": {"title": "UPSSSC PET 2026 – 25 अक्टूबर (प्रश्नपत्र कोड NH8) सम्पूर्ण हल", "exam": "UPSSSC", "subject": "PET 2026", "chapter": "हल प्रश्नपत्र", "minutes": 120, "negative": 0.25, "date": "25 अक्टूबर 2026", "shift": "कोड NH8", "note": "Exam Hub टीम द्वारा तैयार संभावित उत्तर — हर उत्तर आधिकारिक/मानक स्रोत से मिलाया गया है। आयोग की आधिकारिक उत्तर कुंजी जारी होने पर अवश्य मिलान करें।", "slug": "upsssc-pet-2026-25oct-nh8"}, "qs": [{"n": 1, "section": "करेंट अफेयर्स", "q": "विश्व वानिकी दिवस (World Forestry Day) प्रति वर्ष किस तारीख को मनाया जाता है?", "options": ["18 मार्च", "24 मार्च", "21 मार्च", "22 मार्च", "उपर्युक्त में से कोई नहीं"], "answer": 2, "explain": "विश्व वानिकी दिवस / अंतरराष्ट्रीय वन दिवस हर वर्ष 21 मार्च को मनाया जाता है। 22 मार्च = विश्व जल दिवस, 24 मार्च = विश्व क्षय रोग (TB) दिवस।", "source": "संयुक्त राष्ट्र महासभा प्रस्ताव 67/200 (2012) — un.org/en/observances/forests-and-trees-day"}, {"n": 2, "section": "सामान्य ज्ञान", "q": "निम्नलिखित में से किस देश की आधिकारिक मुद्रा 'यूरो' नहीं है?", "options": ["फिनलैंड", "स्लोवेनिया", "स्वीडन", "एस्टोनिया", "उपर्युक्त में से कोई नहीं"], "answer": 2, "explain": "स्वीडन यूरोपीय संघ का सदस्य है पर उसकी मुद्रा 'स्वीडिश क्रोना (SEK)' है। फिनलैंड (2002), स्लोवेनिया (2007), एस्टोनिया (2011) यूरो अपना चुके हैं।", "source": "European Central Bank — ecb.europa.eu (Euro area countries)"}, {"n": 3, "section": "करेंट अफेयर्स", "q": "भारत सरकार की कौन-सी पहल, जिसे 2023 में शुरू किया गया था, रामसर स्थलों के संरक्षण मूल्यों को बढ़ावा देने के लिए प्रारंभ की गई थी?", "options": ["अमृत धरोहर", "आर्द्रभूमि बचाओ अभियान", "मिशन लाइफ (Mission LiFE)", "मिष्टी (MISHTI)", "उपर्युक्त में से कोई नहीं"], "answer": 0, "explain": "'अमृत धरोहर' योजना की घोषणा केंद्रीय बजट 2023-24 में हुई और 5 जून 2023 को शुरू हुई — उद्देश्य: रामसर स्थलों के अनूठे संरक्षण मूल्यों को बढ़ावा देना, इको-टूरिज़्म और स्थानीय आजीविका। MISHTI = मैंग्रोव रोपण योजना।", "source": "PIB (पर्यावरण, वन एवं जलवायु परिवर्तन मंत्रालय), 5 जून 2023; केंद्रीय बजट भाषण 2023-24"}, {"n": 4, "section": "सामान्य ज्ञान", "q": "'द ग्रेट इंडियन नॉवेल' किसने लिखी थी?", "options": ["शशि थरूर", "विक्रम सेठ", "अमिताव घोष", "अरविंद अडिगा", "उपर्युक्त में से कोई नहीं"], "answer": 0, "explain": "'The Great Indian Novel' (1989) शशि थरूर का व्यंग्यात्मक उपन्यास है, जो महाभारत की कथा को भारतीय स्वतंत्रता संग्राम पर रखकर लिखा गया। विक्रम सेठ — A Suitable Boy; अरविंद अडिगा — The White Tiger।", "source": "मानक सामान्य ज्ञान — Penguin/Viking प्रकाशन विवरण"}, {"n": 5, "section": "भारतीय संविधान/राजव्यवस्था", "q": "स्वतंत्र भारत में लोकसभा के पहले अध्यक्ष (स्पीकर) कौन थे?", "options": ["जी.वी. मावलंकर", "के.एस. हेगड़े", "हुकम सिंह", "एम. अनंतशयनम अय्यंगार", "उपर्युक्त में से कोई नहीं"], "answer": 0, "explain": "गणेश वासुदेव मावलंकर 15 मई 1952 को पहली लोकसभा के अध्यक्ष बने। एम. अनंतशयनम अय्यंगार पहले उपाध्यक्ष थे और बाद में दूसरे अध्यक्ष बने।", "source": "लोकसभा सचिवालय — loksabha.nic.in (Former Speakers)"}, {"n": 6, "section": "भूगोल", "q": "निम्नलिखित में से कौन-सा देश भारत के साथ स्थलीय सीमा साझा नहीं करता है?", "options": ["श्रीलंका", "म्याँमार", "भूटान", "नेपाल", "उपर्युक्त में से कोई नहीं"], "answer": 0, "explain": "श्रीलंका भारत से पाक जलडमरूमध्य और मन्नार की खाड़ी द्वारा समुद्र से अलग है — उसकी कोई स्थलीय सीमा भारत से नहीं मिलती। म्याँमार, भूटान, नेपाल भारत के स्थलीय पड़ोसी हैं।", "source": "NCERT कक्षा 9 भूगोल 'समकालीन भारत-1', अध्याय 1 'भारत: आकार और स्थिति' (पड़ोसी देश)"}, {"n": 7, "section": "इतिहास", "q": "1921 में भारतीय राष्ट्रीय ध्वज का स्वरूप (डिज़ाइन) किसने तैयार किया था?", "options": ["सुरैया तैयबजी", "पिंगली वेंकैया", "पट्टाभि सीतारमैया", "जे.बी. कृपलानी", "उपर्युक्त में से कोई नहीं"], "answer": 1, "explain": "1921 में विजयवाड़ा कांग्रेस अधिवेशन में पिंगली वेंकैया ने लाल-हरे रंग (बाद में सफेद व चरखा जोड़ा गया) वाला ध्वज गांधीजी को प्रस्तुत किया। 1947 के वर्तमान तिरंगे के अंतिम रूप से सुरैया तैयबजी का नाम जुड़ता है।", "source": "भारत सरकार — knowindia.india.gov.in (राष्ट्रीय ध्वज); PIB 'हर घर तिरंगा'"}, {"n": 8, "section": "करेंट अफेयर्स", "q": "साहित्य और शिक्षा के क्षेत्र में योगदान के लिए 2025 में निम्नलिखित में से किसे पद्म विभूषण से सम्मानित किया गया?", "options": ["एस.एल. भैरप्पा", "राम बहादुर राय", "विनोद धाम", "एम.टी. वासुदेवन नायर", "उपर्युक्त में से कोई नहीं"], "answer": 3, "explain": "पद्म पुरस्कार 2025 में मलयालम साहित्यकार एम.टी. वासुदेवन नायर (मरणोपरांत) को साहित्य एवं शिक्षा में पद्म विभूषण मिला। एस.एल. भैरप्पा, राम बहादुर राय व विनोद धाम को पद्म भूषण मिला था।", "source": "PIB, गृह मंत्रालय — पद्म पुरस्कार 2025 सूची (25 जनवरी 2025); padmaawards.gov.in"}, {"n": 9, "section": "सामान्य विज्ञान", "q": "निम्नलिखित में से किस संगठन ने भारत की NavIC उपग्रह संचालन (नेविगेशन) प्रणाली विकसित की?", "options": ["भारतीय अंतरिक्ष अनुसंधान संगठन (ISRO)", "रक्षा अनुसंधान एवं विकास संगठन (DRDO)", "वैज्ञानिक तथा औद्योगिक अनुसंधान परिषद (CSIR)", "भाभा परमाणु अनुसंधान केंद्र (BARC)", "उपर्युक्त में से कोई नहीं"], "answer": 0, "explain": "NavIC (Navigation with Indian Constellation) = IRNSS, ISRO द्वारा विकसित भारत की क्षेत्रीय उपग्रह नेविगेशन प्रणाली।", "source": "ISRO — isro.gov.in (Satellite Navigation / NavIC)"}, {"n": 10, "section": "सामान्य ज्ञान", "q": "निम्नलिखित में से किस शहर में विंबलडन टेनिस चैंपियनशिप आयोजित की जाती है?", "options": ["पेरिस", "लंदन", "मेलबर्न", "न्यूयॉर्क", "उपर्युक्त में से कोई नहीं"], "answer": 1, "explain": "विंबलडन — लंदन (ग्रास कोर्ट)। पेरिस = फ्रेंच ओपन, मेलबर्न = ऑस्ट्रेलियन ओपन, न्यूयॉर्क = यूएस ओपन।", "source": "All England Lawn Tennis Club — wimbledon.com"}, {"n": 11, "section": "तर्कशक्ति", "q": "विषम को चुनिए:", "options": ["जयपुर", "महाराष्ट्र", "केरल", "गुजरात", "उपर्युक्त में से कोई नहीं"], "answer": 0, "explain": "महाराष्ट्र, केरल, गुजरात — राज्य हैं; जयपुर एक शहर (राजस्थान की राजधानी) है। अतः जयपुर विषम।", "source": ""}, {"n": 12, "section": "तर्कशक्ति", "q": "किसी विशिष्ट कूट भाषा में, यदि \"SPECIAL\" को 65 के रूप में कूटित किया जाता है, तो उसी कूट भाषा का उपयोग करके \"CONNECT\" को कैसे कूटित किया जाएगा?", "options": ["70", "72", "78", "74", "उपर्युक्त में से कोई नहीं"], "answer": 3, "explain": "नियम: अक्षरों के वर्णमाला क्रमांक का योग।\nSPECIAL = S(19)+P(16)+E(5)+C(3)+I(9)+A(1)+L(12) = 65 ✔\nCONNECT = C(3)+O(15)+N(14)+N(14)+E(5)+C(3)+T(20)\n= 3+15+14+14+5+3+20 = 74", "source": ""}, {"n": 13, "section": "तर्कशक्ति", "q": "छह व्यक्ति (A, B, C, D, E और F) एक पंक्ति में बैठे हैं और सभी का मुँह उत्तर दिशा की ओर है। C, B के ठीक बाईं ओर बैठा है और A के दाईं ओर तीसरा व्यक्ति है। D सबसे दाहिने छोर पर बैठा है। यदि E, F के ठीक दाईं ओर बैठा है, तो सबसे बाएँ छोर पर कौन बैठा है?", "options": ["E", "F", "A", "B", "उपर्युक्त में से कोई नहीं"], "answer": 2, "explain": "स्थान 1 (बाएँ) से 6 (दाएँ):\n• D = 6 (सबसे दाएँ)\n• C, A के दाएँ तीसरा → यदि A = x तो C = x+3, और B = C+1 = x+4\n• B ≤ 5 ⇒ x ≤ 1 ⇒ A = 1, C = 4, B = 5\n• शेष स्थान 2, 3 पर F–E (E, F के ठीक दाएँ) ⇒ F = 2, E = 3\nक्रम: A F E C B D ⇒ सबसे बाएँ = A", "source": ""}, {"n": 14, "section": "तर्कशक्ति", "q": "निम्नलिखित में से किस वर्ष का कैलेंडर 2016 के समान होगा?", "options": ["2052", "2044", "2028", "2032", "उपर्युक्त में से कोई नहीं"], "answer": 1, "explain": "नियम: लीप वर्ष का कैलेंडर सामान्यतः 28 वर्ष बाद दोहराता है (बीच में कोई शताब्दी गैर-लीप वर्ष न हो)।\n2016 + 28 = 2044\nजाँच: 2016→2044 के बीच विषम दिन = 28 वर्ष में 7 लीप वर्ष ⇒ 28 + 7 = 35 विषम दिन = 5 सप्ताह ⇒ 0 विषम दिन ✔, और 2044 भी लीप वर्ष है।", "source": ""}, {"n": 15, "section": "तर्कशक्ति", "q": "P, Q की बहन है। Q, R का पिता है। S, R की माँ है और T, S का पिता है। S का Q से क्या संबंध है?", "options": ["बहन", "पुत्री", "माँ", "पत्नी", "उपर्युक्त में से कोई नहीं"], "answer": 3, "explain": "Q = R का पिता, S = R की माँ ⇒ S और Q, R के माता-पिता ⇒ S, Q की पत्नी है।", "source": ""}, {"n": 16, "section": "इतिहास", "q": "खान अब्दुल गफ्फार खान द्वारा स्थापित खुदाई खिदमतगार आंदोलन को किस अन्य नाम से भी जाना जाता था?", "options": ["रेशमी रूमाल (सिल्क लेटर) आंदोलन", "लाल कुर्ती (रेड शर्ट) आंदोलन", "होम रूल आंदोलन", "खिलाफ़त आंदोलन", "उपर्युक्त में से कोई नहीं"], "answer": 1, "explain": "'सीमांत गांधी' खान अब्दुल गफ्फार खान ने 1929 में खुदाई खिदमतगार (ईश्वर के सेवक) संगठन बनाया; लाल वर्दी के कारण इन्हें 'लाल कुर्ती / Red Shirts' कहा गया।", "source": "NCERT कक्षा 12 इतिहास 'भारतीय इतिहास के कुछ विषय-III', थीम 13 (महात्मा गांधी और राष्ट्रीय आंदोलन); बिपिन चंद्र — भारत का स्वतंत्रता संघर्ष"}, {"n": 17, "section": "इतिहास", "q": "भारत छोड़ो आंदोलन के दौरान मुंबई में गुप्त कांग्रेस रेडियो की शुरुआत निम्नलिखित में से किस स्वतंत्रता सेनानी ने की थी?", "options": ["सुचेता कृपलानी", "अरुणा आसफ अली", "उषा मेहता", "मातंगिनी हाज़रा", "उपर्युक्त में से कोई नहीं"], "answer": 2, "explain": "अगस्त 1942 में उषा मेहता ने बंबई से भूमिगत 'कांग्रेस रेडियो' चलाया। अरुणा आसफ अली ने 9 अगस्त 1942 को गोवालिया टैंक में तिरंगा फहराया; मातंगिनी हाज़रा — तमलुक (बंगाल) में शहीद।", "source": "NCERT कक्षा 8 'हमारे अतीत-III', अध्याय 'राष्ट्रीय आंदोलन का संघटन'; बिपिन चंद्र — आधुनिक भारत (NCERT पुरानी)"}, {"n": 18, "section": "इतिहास", "q": "दादाभाई नौरोजी ने ब्रिटिश हाउस ऑफ कॉमन्स में किस निर्वाचन-क्षेत्र का प्रतिनिधित्व किया था?", "options": ["होल्बोर्न डिवीजन", "फिन्सबरी सेंट्रल", "इस्लिंगटन नॉर्थ", "फिन्सबरी ईस्ट", "उपर्युक्त में से कोई नहीं"], "answer": 1, "explain": "दादाभाई नौरोजी 1892 में लिबरल पार्टी से 'फिन्सबरी सेंट्रल' (लंदन) से चुने गए — ब्रिटिश संसद के पहले भारतीय सदस्य।", "source": "UK Parliament — parliament.uk (Dadabhai Naoroji, MP for Finsbury Central 1892–95)"}, {"n": 19, "section": "इतिहास", "q": "निम्नलिखित में से कौन-सी संवैधानिक संस्था भारत सरकार अधिनियम, 1935 के अंतर्गत स्थापित की गई थी?", "options": ["शाही विधान परिषद", "भारत परिषद", "राज्य परिषद", "भारत का संघीय न्यायालय", "उपर्युक्त में से कोई नहीं"], "answer": 3, "explain": "भारत सरकार अधिनियम 1935 के तहत 1 अक्टूबर 1937 को दिल्ली में संघीय न्यायालय (Federal Court) बना। भारत परिषद — 1858 अधिनियम; राज्य परिषद (Council of State) — 1919 अधिनियम।", "source": "एम. लक्ष्मीकांत — भारत की राजव्यवस्था, अध्याय 1 (ऐतिहासिक पृष्ठभूमि); NCERT कक्षा 11 'भारत का संविधान: सिद्धांत और व्यवहार' अध्याय 1"}, {"n": 20, "section": "इतिहास", "q": "स्वदेशी आंदोलन के दौरान डिज़ाइन किए गए तिरंगे झंडे पर बने आठ कमल किसका प्रतिनिधित्व करते थे?", "options": ["आठ प्रमुख देशी रियासतें", "ब्रिटिश भारत के आठ प्रांत", "भारत के आठ प्रमुख भाषाई क्षेत्र", "भारत के आठ प्रमुख भौगोलिक क्षेत्र", "उपर्युक्त में से कोई नहीं"], "answer": 1, "explain": "7 अगस्त 1906 (कलकत्ता, पारसी बागान) में फहराए गए 'कलकत्ता ध्वज' (हरी-पीली-लाल पट्टियाँ) की हरी पट्टी पर बने 8 कमल ब्रिटिश भारत के 8 प्रांतों के प्रतीक थे; बीच में 'वंदे मातरम्' लिखा था।", "source": "भारत सरकार — knowindia.india.gov.in / Ministry of Culture: 'Evolution of the Indian National Flag'"}, {"n": 21, "section": "आँकड़ा विश्लेषण", "q": "जनवरी से फरवरी तक उत्पाद Q की बिक्री में कितने प्रतिशत की वृद्धि हुई?", "options": ["25%", "30%", "35%", "20%", "उपर्युक्त में से कोई नहीं"], "answer": 0, "explain": "Q: जनवरी = 180, फरवरी = 225\nवृद्धि = 225 − 180 = 45\nप्रतिशत वृद्धि = (45 / 180) × 100 = 25%", "source": "", "ctx": "तालिका (Q21–25): जनवरी और फरवरी में बेचे गए पाँच उत्पादों की इकाइयाँ\nउत्पाद   जनवरी   फरवरी\nP        240      300\nQ        180      225\nR        320      280\nS        200      260\nT        260      335\nकुल      1200     1400"}, {"n": 22, "section": "आँकड़ा विश्लेषण", "q": "उत्पादों Q और S की जनवरी की संयुक्त बिक्री का उत्पादों P और R की फरवरी की संयुक्त बिक्री से अनुपात क्या है?", "options": ["13 : 14", "19 : 29", "15 : 17", "22 : 13", "उपर्युक्त में से कोई नहीं"], "answer": 1, "explain": "Q + S (जनवरी) = 180 + 200 = 380\nP + R (फरवरी) = 300 + 280 = 580\nअनुपात = 380 : 580 = (÷20) 19 : 29", "source": "", "ctx": "तालिका (Q21–25): जनवरी और फरवरी में बेचे गए पाँच उत्पादों की इकाइयाँ\nउत्पाद   जनवरी   फरवरी\nP        240      300\nQ        180      225\nR        320      280\nS        200      260\nT        260      335\nकुल      1200     1400"}, {"n": 23, "section": "आँकड़ा विश्लेषण", "q": "यदि उत्पाद R की फरवरी की बिक्री की 40 इकाइयों को उत्पाद S को पुनः आवंटित किया जाता है, जबकि कुल फरवरी की बिक्री अपरिवर्तित रहती है, तो संशोधित फरवरी की बिक्री में उत्पाद R का उत्पाद S से अनुपात क्या होगा?", "options": ["2 : 3", "4 : 5", "5 : 6", "7 : 8", "उपर्युक्त में से कोई नहीं"], "answer": 1, "explain": "नया R = 280 − 40 = 240\nनया S = 260 + 40 = 300\nअनुपात = 240 : 300 = (÷60) 4 : 5", "source": "", "ctx": "तालिका (Q21–25): जनवरी और फरवरी में बेचे गए पाँच उत्पादों की इकाइयाँ\nउत्पाद   जनवरी   फरवरी\nP        240      300\nQ        180      225\nR        320      280\nS        200      260\nT        260      335\nकुल      1200     1400"}, {"n": 24, "section": "आँकड़ा विश्लेषण", "q": "उत्पादों P और S की फरवरी महीने की संयुक्त बिक्री, फरवरी महीने की पाँचों उत्पादों की कुल बिक्री का कितना प्रतिशत थी?", "options": ["40%", "45%", "35%", "50%", "उपर्युक्त में से कोई नहीं"], "answer": 0, "explain": "P + S (फरवरी) = 300 + 260 = 560\nकुल फरवरी = 1400\nप्रतिशत = (560 / 1400) × 100 = 40%", "source": "", "ctx": "तालिका (Q21–25): जनवरी और फरवरी में बेचे गए पाँच उत्पादों की इकाइयाँ\nउत्पाद   जनवरी   फरवरी\nP        240      300\nQ        180      225\nR        320      280\nS        200      260\nT        260      335\nकुल      1200     1400"}, {"n": 25, "section": "आँकड़ा विश्लेषण", "q": "पाँचों उत्पादों की फरवरी में प्रति उत्पाद औसत (माध्य) बिक्री और जनवरी में प्रति उत्पाद औसत (माध्य) बिक्री के बीच कितना अंतर है?", "options": ["45 इकाइयाँ", "35 इकाइयाँ", "30 इकाइयाँ", "40 इकाइयाँ", "उपर्युक्त में से कोई नहीं"], "answer": 3, "explain": "फरवरी औसत = 1400 / 5 = 280\nजनवरी औसत = 1200 / 5 = 240\nअंतर = 280 − 240 = 40 इकाइयाँ\n(शॉर्टकट: (1400 − 1200)/5 = 40)", "source": "", "ctx": "तालिका (Q21–25): जनवरी और फरवरी में बेचे गए पाँच उत्पादों की इकाइयाँ\nउत्पाद   जनवरी   फरवरी\nP        240      300\nQ        180      225\nR        320      280\nS        200      260\nT        260      335\nकुल      1200     1400"}, {"n": 26, "section": "इतिहास", "q": "आइन-ए-अकबरी के अनुसार, किस श्रेणी की भूमि पर वार्षिक रूप से खेती की जाती थी और उसे परती नहीं छोड़ा जाता था?", "options": ["बंजर", "चचर", "पोलज", "परौती", "उपर्युक्त में से कोई नहीं"], "answer": 2, "explain": "आइन-ए-अकबरी का भूमि वर्गीकरण: पोलज — हर वर्ष खेती, कभी परती नहीं; परौती — शक्ति लौटाने हेतु कुछ समय परती; चचर — 3-4 वर्ष परती; बंजर — 5 वर्ष या अधिक परती।", "source": "NCERT कक्षा 12 इतिहास 'भारतीय इतिहास के कुछ विषय-II', थीम 8 'किसान, ज़मींदार और राज्य' (भूमि का वर्गीकरण)"}, {"n": 27, "section": "इतिहास", "q": "भारत पर प्राचीन यूनानी ग्रंथ इंडिका किसने लिखा था?", "options": ["हेरोडोटस", "अरस्तू", "ज़ेनोफ़ोन", "मेगस्थनीज़", "उपर्युक्त में से कोई नहीं"], "answer": 3, "explain": "सेल्यूकस निकेटर का राजदूत मेगस्थनीज़ चंद्रगुप्त मौर्य के दरबार (पाटलिपुत्र) में रहा और 'इंडिका' लिखी।", "source": "NCERT कक्षा 12 इतिहास भाग-1, थीम 2 'राजा, किसान और नगर'; NCERT कक्षा 6 'हमारे अतीत-I'"}, {"n": 28, "section": "इतिहास", "q": "निम्नलिखित में से किस शासक ने 606 – 647 ईसवी के दौरान कन्नौज पर शासन किया था?", "options": ["शशांक", "पुलकेशिन द्वितीय", "हर्षवर्धन", "यशोधर्मन", "उपर्युक्त में से कोई नहीं"], "answer": 2, "explain": "हर्षवर्धन 606 ई. में थानेसर का राजा बना, राजधानी कन्नौज ले गया और 647 ई. तक शासन किया। दरबारी कवि बाणभट्ट ने 'हर्षचरित' लिखा।", "source": "NCERT कक्षा 6 'हमारे अतीत-I', अध्याय 'नए साम्राज्य और राज्य' (हर्षवर्धन)"}, {"n": 29, "section": "इतिहास", "q": "\"मानवजाति के लिए एक जाति, एक धर्म, एक ईश्वर\" के सिद्धांत का समर्थन निम्नलिखित में से किस समाज सुधारक ने किया?", "options": ["ज्योतिराव फुले", "स्वामी विवेकानन्द", "श्री नारायण गुरु", "रामकृष्ण परमहंस", "उपर्युक्त में से कोई नहीं"], "answer": 2, "explain": "केरल के समाज सुधारक श्री नारायण गुरु (एझवा समुदाय) का प्रसिद्ध नारा — 'Oru Jathi, Oru Matham, Oru Daivam, Manushyanu' (मनुष्य के लिए एक जाति, एक धर्म, एक ईश्वर)।", "source": "NCERT कक्षा 8 'हमारे अतीत-III', अध्याय 'जातीय व्यवस्था की चुनौती' (श्री नारायण गुरु)"}, {"n": 30, "section": "इतिहास", "q": "निम्नलिखित में से कौन-सा गौतम बुद्ध द्वारा उपदेशित आर्य अष्टांगिक मार्ग का घटक नहीं है?", "options": ["सम्यक् स्मृति", "सम्यक् दृष्टि", "सम्यक् आजीविका", "सम्यक् भक्ति", "उपर्युक्त में से कोई नहीं"], "answer": 3, "explain": "अष्टांगिक मार्ग: सम्यक् दृष्टि, संकल्प pe"}, {"n": 46, "section": "अपठित गद्यांश", "q": "गद्यांश के अनुसार परोपकार का व्यापक अर्थ क्या है?", "options": ["दूसरों के सुख-दुःख में सहयोग करना", "सामाजिक प्रतिष्ठा बढ़ाना", "जरूरतमंदों को धन देना", "दूसरों को सदैव अपने ऊपर निर्भर बनाना", "उपर्युक्त में से कोई नहीं"], "answer": 0, "explain": "गद्यांश: परोपकार व्यक्ति को 'दूसरों के सुख-दुःख से जोड़ता है'; इसका अर्थ 'केवल धन या वस्तु देना नहीं' है।", "source": "गद्यांश, अनुच्छेद 1", "ctx": "अपठित गद्यांश (Q46–50):\nपरोपकार मनुष्य के उन श्रेष्ठ गुणों में से है, जो उसे केवल अपने हित के बारे में सोचने से ऊपर उठाकर दूसरों के सुख-दुःख से जोड़ता है। इसका अर्थ केवल किसी जरूरतमंद को धन या वस्तु देना नहीं है। किसी व्यक्ति को कठिन समय में उचित सलाह देना, किसी विद्यार्थी को पढ़ाई में सहायता करना, किसी वृद्ध को आवश्यक कार्य में सहयोग देना या किसी अनजान व्यक्ति को संकट में देखकर उसकी मदद करना भी परोपकार के ही रूप हैं। इसमें सहायता की मात्रा से अधिक भावना और उद्देश्य का महत्त्व होता है।\nवास्तविक परोपकार वह है जिसमें व्यक्ति किसी प्रतिफल, प्रशंसा या सामाजिक प्रतिष्ठा की अपेक्षा किए बिना दूसरों के हित में कार्य करता है। यदि सहायता केवल प्रसिद्धि प्राप्त करने या बदले में लाभ पाने के उद्देश्य से की जाए, तो उसके पीछे परोपकार की भावना कमजोर पड़ जाती है। परोपकार व्यक्ति के भीतर करुणा, सहानुभूति और सामाजिक उत्तरदायित्व जैसे गुणों को विकसित करता है। इससे व्यक्ति यह समझ पाता है कि समाज में उसकी भूमिका केवल अपने अधिकारों तक सीमित नहीं है, बल्कि दूसरों के प्रति उसके कुछ दायित्व भी हैं।\nआज के व्यस्त और प्रतिस्पर्धात्मक जीवन में परोपकार का महत्त्व और बढ़ गया है। आर्थिक सहायता के अतिरिक्त समय, ज्ञान और कौशल का उपयोग भी समाज के लिए किया जा सकता है। कोई चिकित्सक जरूरतमंदों को निःशुल्क परामर्श दे सकता है, कोई शिक्षक वंचित बच्चों को पढ़ा सकता है और कोई युवा अपने समय का उपयोग सामुदायिक कार्यों में कर सकता है। छोटे-छोटे सहयोग मिलकर सामाजिक विश्वास को मजबूत करते हैं। परोपकार का उद्देश्य किसी को सदैव अपने ऊपर निर्भर बनाना नहीं, बल्कि जहाँ संभव हो, उसे सक्षम बनाना भी होना चाहिए। इस दृष्टि से परोपकार केवल दया का प्रदर्शन नहीं, बल्कि मानवीय संवेदना औ दस्यता खरीदी\nA        600       240\nB        750       375\nC        900       540\nD        800       400\nE        950       570\nकुल      4000      2125"}, {"n": 62, "section": "आँकड़ा विश्लेषण", "q": "केंद्र B पर सदस्यता न खरीदने वाले आगंतुकों की संख्या, केंद्र C पर सदस्यता न खरीदने वाले आगंतुकों की संख्या से कितनी अधिक है?", "options": ["20", "15", "10", "25", "उपर्युक्त में से कोई नहीं"], "answer": 1, "explain": "B: न खरीदने वाले = 750 − 375 = 375\nC: न खरीदने वाले = 900 − 540 = 360\nअंतर = 375 − 360 = 15", "source": "", "ctx": "तालिका (Q61–65): एक प्रचार महीने में पाँच फिटनेस केंद्रों में आगंतुक और सदस्यता खरीदने वाले\nकेंद्र   आगंतुक   सदस्यता खरीदी\nA        600       240\nB        750       375\nC        900       540\nD        800       400\nE        950       570\nकुल      4000      2125"}, {"n": 63, "section": "आँकड़ा विश्लेषण", "q": "सभी पाँच केंद्रों में सदस्यता खरीदने वाले कुल आगंतुकों का कौन-सा अंश (भिन्न) केंद्रों C और E से मिलकर आता है?", "options": ["188/425", "117/200", "222/425", "111/200", "उपर्युक्त में से कोई नहीं"], "answer": 2, "explain": "C + E = 540 + 570 = 1110\nकुल सदस्यता = 2125\nअंश = 1110/2125 = (÷5) 222/425", "source": "", "ctx": "तालिका (Q61–65): एक प्रचार महीने में पाँच फिटनेस केंद्रों में आगंतुक और सदस्यता खरीदने वाले\nकेंद्र   आगंतुक   सदस्यता खरीदी\nA        600       240\nB        750       375\nC        900       540\nD        800       400\nE        950       570\nकुल      4000      2125"}, {"n": 64, "section": "आँकड़ा विश्लेषण", "q": "केंद्र D पर, 800 में से 400 आगंतुकों ने सदस्यता खरीदी। यदि सदस्यता न खरीदने वाले 50 आगंतुकों को सदस्यता खरीदने वाले 50 नए आगंतुकों से बदल दिया जाए, तो केंद्र D पर सदस्यता खरीदने वाले और न खरीदने वाले आगंतुकों का नया अनुपात क्या होगा?", "options": ["4 : 3", "9 : 7", "2 : 5", "5 : 4", "उपर्युक्त में से कोई नहीं"], "answer": 1, "explain": "खरीदने वाले = 400 + 50 = 450\nन खरीदने वाले = 400 − 50 = 350\nअनुपात = 450 : 350 = 9 : 7", "source": "", "ctx": "तालिका (Q61–65): एक प्रचार महीने में पाँच फिटनेस केंद्रों में आगंतुक और सदस्यता खरीदने वाले\nकेंद्र   आगंतुक   सदस्यता खरीदी\nA        600       240\nB        750       375\nC        900       540\nD        800       400\nE        950       570\nकुल      4000      2125"}, {"n": 65, "section": "आँकड़ा विश्लेषण", "q": "निम्नलिखित में से फिटनेस केंद्रों के किस युग्म में सदस्यता खरीदने वाले आगंतुकों का प्रतिशत समान था?", "options": ["A और E", "C और D", "A और B", "B और D", "उपर्युक्त में से कोई नहीं"], "answer": 3, "explain": "A = 240/600 = 40%\nB = 375/750 = 50%\nC = 540/900 = 60%\nD = 400/800 = 50%\nE = 570/950 = 60%\nसमान: B और D (50%) [C और E (60%) भी, पर वह विकल्प में नहीं]", "source": "", "ctx": "तालिका (Q61–65): एक प्रचार महीने में पाँच फिटनेस केंद्रों में आगंतुक और सदस्यता खरीदने वाले\nकेंद्र   आगंतुक   सदस्यता खरीदी\nA        600       240\nB        750       375\nC        900       540\nD        800       400\nE        950       570\nकुल      4000      2125"}, {"n": 66, "section": "सामान्य विज्ञान", "q": "निम्नलिखित में से कौन-सा बिना बुझे चूने (क्विकलाइम) का रासायनिक सूत्र है?", "options": ["CaCO₃", "CaO", "CaCl₂", "Ca(OH)₂", "उपर्युक्त में से कोई नहीं"], "answer": 1, "explain": "बिना बुझा चूना = कैल्शियम ऑक्साइड CaO। CaO + H₂O → Ca(OH)₂ (बुझा चूना) + ऊष्मा। CaCO₃ = चूना पत्थर।", "source": "NCERT कक्षा 10 विज्ञान, अध्याय 1 'रासायनिक अभिक्रियाएँ एवं समीकरण'"}, {"n": 67, "section": "सामान्य विज्ञान", "q": "कौन-सी प्रक्रिया भोजन को मानव आहारनाल के माध्यम से आगे बढ़ाती है?", "options": ["चर्वण (मेस्टिकेशन)", "निगलन (डिग्लूटिशन)", "खंडीकरण (सेगमेंटेशन)", "क्रमाकुंचन (पेरिस्टाल्सिस)", "उपर्युक्त में से कोई नहीं"], "answer": 3, "explain": "आहारनाल की दीवार की पेशियों का लयबद्ध संकुचन-शिथिलन (क्रमाकुंचन) भोजन को आगे धकेलता है।", "source": "NCERT कक्षा 10 विज्ञान, अध्याय 'जैव प्रक्रम' (पोषण — मानव पाचन तंत्र)"}, {"n": 68, "section": "सामान्य विज्ञान", "q": "अपवर्तन के नियम को किस अन्य नाम से भी जाना जाता है?", "options": ["हाइगेन्स का नियम", "फ्रेस्नेल का नियम", "ब्रूस्टर का नियम", "स्नेल का नियम", "उपर्युक्त में से कोई नहीं"], "answer": 3, "explain": "अपवर्तन का दूसरा नियम: sin i / sin r = नियतांक (अपवर्तनांक) — इसे स्नेल का नियम कहते हैं।", "source": "NCERT कक्षा 10 विज्ञान, अध्याय 'प्रकाश – परावर्तन तथा अपवर्तन'"}, {"n": 69, "section": "सामान्य विज्ञान", "q": "एक मशीन 50 N का प्रयास लगाने पर 200 N का भार उठाती है। इस मशीन का यांत्रिक लाभ क्या है?", "options": ["5", "4", "8", "2", "उपर्युक्त में से कोई नहीं"], "answer": 1, "explain": "यांत्रिक लाभ (MA) = भार / प्रयास\n= 200 N / 50 N = 4", "source": "NCERT/मानक भौतिकी — सरल मशीनें"}, {"n": 70, "section": "सामान्य विज्ञान", "q": "ऑक्सीजन परमाणुओं के एक मोल का द्रव्यमान कितना होता है?", "options": ["8 ग्राम", "32 ग्राम", "16 ग्राम", "48 ग्राम", "उपर्युक्त में से कोई नहीं"], "answer": 2, "explain": "ऑक्सीजन का परमाणु द्रव्यमान = 16 u ⇒ 1 मोल O परमाणु = 16 g। (1 मोल O₂ अणु = 32 g — यह भ्रम का विकल्प है)", "source": "NCERT कक्षा 9 विज्ञान, अध्याय 3 'परमाणु एवं अणु' (मोल संकल्पना)"}, {"n": 71, "section": "भारतीय संविधान/राजव्यवस्था", "q": "भारत के संविधान के अनुच्छेद 39क (39A) के अंतर्गत निम्नलिखित में से कौन-सा प्रावधान किया गया है?", "options": ["ग्राम पंचायतों का संगठन", "प्रसूति सहायता का प्रबंध", "नागरिकों के लिए एक समान सिविल संहिता", "समान न्याय और निःशुल्क विधिक सहायता", "उपर्युक्त में से कोई नहीं"], "answer": 3, "explain": "अनुच्छेद 39A (42वाँ संशोधन 1976) — समान न्याय और निःशुल्क विधिक सहायता। अनुच्छेद 40 — ग्राम पंचायत; 42 — प्रसूति सहायता; 44 — समान सिविल संहिता।", "source": "भारत का संविधान, भाग IV (राज्य की नीति के निदेशक तत्त्व) — legislative.gov.in"}, {"n": 72, "section": "भारतीय संविधान/राजव्यवस्था", "q": "जिले में राजस्व प्रशासन का सर्वोच्च अधिकारी कौन होता है?", "options": ["तहसीलदार", "उपायुक्त", "सब-डिविजनल मजिस्ट्रेट (उप-जिलाधिकारी) (एस.डी.एम.)", "संभागायुक्त (मंडलायुक्त)", "उपर्युक्त में से कोई नहीं"], "answer": 1, "explain": "जिले में राजस्व प्रशासन का प्रमुख जिलाधिकारी/कलेक्टर होता है, जिसे कई राज्यों में उपायुक्त (Deputy Commissioner) कहा जाता है। मंडलायुक्त कई जिलों (मंडल) का अधिकारी है, जिले का नहीं; SDM व तहसीलदार उसके अधीन हैं।", "source": "NCERT कक्षा 6/7 'सामाजिक एवं राजनीतिक जीवन' (ज़िला प्रशासन); उ.प्र. राजस्व संहिता 2006"}, {"n": 73, "section": "भारतीय संविधान/राजव्यवस्था", "q": "निम्नलिखित में से किसने भारत के संविधान के मूल हिंदी संस्करण का सुलेखन (कैलिग्राफी) किया था?", "options": ["प्रेम बिहारी नारायण रायज़ादा", "ब्योहर राममनोहर सिन्हा", "नंदलाल बोस", "वसंत के. वैद्य", "उपर्युक्त में से कोई नहीं"], "answer": 3, "explain": "मूल हिंदी संविधान का सुलेखन वसंत कृष्ण वैद्य ने किया। अंग्रेज़ी संस्करण — प्रेम बिहारी नारायण रायज़ादा; चित्रांकन/सज्जा — नंदलाल बोस व ब्योहर राममनोहर सिन्हा।", "source": "लोकसभा सचिवालय / संस्कृति मंत्रालय — 'संविधान की मूल प्रति'; PIB संविधान दिवस"}, {"n": 74, "section": "इतिहास", "q": "1862 में ब्रिटिश भारत का पहला उच्च न्यायालय निम्नलिखित में से किस शहर में स्थापित किया गया था?", "options": ["बॉम्बे", "इलाहाबाद", "कलकत्ता", "मद्रास", "उपर्युक्त में से कोई नहीं"], "answer": 2, "explain": "भारतीय उच्च न्यायालय अधिनियम 1861 के तहत कलकत्ता उच्च न्यायालय 1 जुलाई 1862 को स्थापित हुआ — भारत का सबसे पुराना। बॉम्बे (14 अगस्त 1862), मद्रास (15 अगस्त 1862), इलाहाबाद (1866)।", "source": "Calcutta High Court — calcuttahighcourt.gov.in (History)"}, {"n": 75, "section": "भारतीय संविधान/राजव्यवस्था", "q": "निम्नलिखित में से कौन राज्य सभा का पदेन सभापति होता है?", "options": ["लोक सभा अध्यक्ष", "भारत के प्रधानमंत्री", "भारत के उपराष्ट्रपति", "भारत के राष्ट्रपति", "उपर्युक्त में से कोई नहीं"], "answer": 2, "explain": "अनुच्छेद 64 एवं 89 — भारत का उपराष्ट्रपति राज्य सभा का पदेन सभापति होता है।", "source": "भारत का संविधान अनुच्छेद 64, 89; NCERT कक्षा 11 'भारत का संविधान: सिद्धांत और व्यवहार' अध्याय 5"}, {"n": 76, "section": "General English", "q": "Choose the word that is opposite in meaning to \"CONCEAL\".", "options": ["Disguise", "Withhold", "Reveal", "Suppress", "उपर्युक्त में से कोई नहीं"], "answer": 2, "explain": "Conceal = छिपाना; विलोम = Reveal (प्रकट करना)। Disguise, Withhold, Suppress — छिपाने के समानार्थी हैं।", "source": "Oxford Learner's Dictionary"}, {"n": 77, "section": "General English", "q": "Choose the correct verb form to fill in the blank.\nIf the students had completed their project on time, the teacher ______ them extra credit.", "options": ["would have given", "would give", "gave", "will give", "उपर्युक्त में से कोई नहीं"], "answer": 0, "explain": "Third conditional: If + had + V3 (past perfect), → would have + V3.\n'had completed' ⇒ 'would have given'.", "source": "Wren & Martin — Conditional Sentences"}, {"n": 78, "section": "General English", "q": "Fill in the blank with the correct modal form:\nYou look exhausted; you ______ get some rest before driving home.", "options": ["might have", "should", "ought", "would rather to", "उपर्युक्त में से कोई नहीं"], "answer": 1, "explain": "सलाह (advice) के लिए 'should + V1': you should get some rest. 'ought' के साथ 'to' चाहिए (ought to get); 'would rather' के बाद 'to' नहीं आता।", "source": "Wren & Martin — Modals"}, {"n": 79, "section": "General English", "q": "According to the passage, how did Einstein differ from people who thought scientists should only care about facts?", "options": ["He believed that imagination was actually more important than knowledge.", "He thought that sailing was better than working on complex math problems.", "He refused to find a balanced lifestyle and focused on facts.", "He believed that artistic creativity had no place in scientific thinking.", "उपर्युक्त में से कोई नहीं"], "answer": 0, "explain": "Passage: 'Unlike people who thought scientists should only care about facts and numbers, Einstein believed that imagination was actually more important than knowledge.'", "source": "Passage, last line", "ctx": "Passage (Q79–80):\nAlbert Einstein was known worldwide as a genius, but his personality was a fascinating mix of two different sides. On one hand, he was a serious scientist who spent hours working on complex math problems that changed how we understand the universe. On the other hand, he was a playful and gentle man who loved playing the violin and sailing his small boat. In him, the deep thinker and the joyful dreamer lived in perfect balance. While his theories helped create powerful new technologies, he was a strong believer in world peace who hated war. He often used his fame to speak out against violence. Unlike people who thought scientists should only care about facts and numbers, Einstein believed that imagination was actually more important than knowledge."}, {"n": 80, "section": "General English", "q": "In the passage, the phrase \"fascinating mix\" refers to Einstein being:", "options": ["a musician and a sailor.", "a creator of technology and a soldier.", "a math teacher and a famous speaker.", "a serious scientist and a playful, gentle person.", "उपर्युक्त में से कोई नहीं"], "answer": 3, "explain": "'fascinating mix of two different sides' — one side a serious scientist, the other a playful and gentle man.", "source": "Passage, lines 1–6", "ctx": "Passage (Q79–80):\nAlbert Einstein was known worldwide as a genius, but his personality was a fascinating mix of two different sides. On one hand, he was a serious scientist who spent hours working on complex math problems that changed how we understand the universe. On the other hand, he was a playful and gentle man who loved playing the violin and sailing his small boat. In him, the deep thinker and the joyful dreamer lived in perfect balance. While his theories helped create powerful new technologies, he was a strong believer in world peace who hated war. He often used his fame to speak out against violence. Unlike people who thought scientists should only care about facts and numbers, Einstein believed that imagination was actually more important than knowledge."}, {"n": 81, "section": "सामान्य हिन्दी", "q": "'आपादमस्तक' शब्द के लिए वाक्यांश है:", "options": ["आदि से लेकर अंत तक", "बड़े से लेकर छोटे तक", "पूरे जीवन तक", "पैर से लेकर सिर तक", "उपर्युक्त में से कोई नहीं"], "answer": 3, "explain": "आपादमस्तक = आ + पाद (पैर) + मस्तक (सिर) — पैर से लेकर सिर तक। ('आद्योपांत' = आदि से अंत तक)", "source": "NCERT/मानक हिन्दी व्याकरण — वाक्यांश के लिए एक शब्द"}, {"n": 82, "section": "सामान्य हिन्दी", "q": "'उग्र' का विलोम शब्द है:", "options": ["प्रखर", "उदार", "सौम्य", "प्रचंड", "उपर्युक्त में से कोई नहीं"], "answer": 2, "explain": "उग्र (तीव्र, क्रोधी) का विलोम = सौम्य (शांत, कोमल)। प्रखर, प्रचंड समानार्थी हैं।", "source": "मानक हिन्दी व्याकरण — विलोम शब्द"}, {"n": 83, "section": "सामान्य हिन्दी", "q": "निम्नलिखित शब्दों में से कौन-सा शब्द वर्तनी की दृष्टि से शुद्ध है?", "options": ["अथिति", "अथीति", "अतीथी", "अतिथि", "उपर्युक्त में से कोई नहीं"], "answer": 3, "explain": "शुद्ध वर्तनी: अतिथि (अ + ति + थि — दोनों में छोटी इ की मात्रा)।", "source": "मानक हिन्दी व्याकरण — वर्तनी शुद्धि"}, {"n": 84, "section": "सामान्य हिन्दी", "q": "'परमौज' शब्द का संधि-विच्छेद है:", "options": ["पर + ओज", "परम + ओज", "परमो + अज", "पर + औज", "उपर्युक्त में से कोई नहीं"], "answer": 1, "explain": "वृद्धि संधि: अ + ओ = औ\nपरम + ओज = परम् + (अ + ओ)ज = परमौज", "source": "NCERT/मानक हिन्दी व्याकरण — स्वर संधि (वृद्धि संधि)"}, {"n": 85, "section": "सामान्य हिन्दी", "q": "'आँखें बिछाना' मुहावरे का अर्थ है:", "options": ["अत्यंत प्यारा", "जरा भी कष्ट न आने देना", "आमना-सामना होना", "प्रेमपूर्वक स्वागत करना", "उपर्युक्त में से कोई नहीं"], "answer": 3, "explain": "'आँखें बिछाना' = प्रेमपूर्वक / श्रद्धा से स्वागत करना। ('आँखों का तारा' = अत्यंत प्यारा; 'आँखें चार होना' = आमना-सामना होना)", "source": "मानक हिन्दी व्याकरण — मुहावरे"}, {"n": 86, "section": "प्रारंभिक गणित", "q": "यदि a − b = 4 और ab = 12 है, तो a² + b² का मान क्या है?", "options": ["32", "16", "28", "40", "उपर्युक्त में से कोई नहीं"], "answer": 3, "explain": "सूत्र: (a − b)² = a² + b² − 2ab\n⇒ a² + b² = (a − b)² + 2ab\n= 4² + 2 × 12\n= 16 + 24 = 40\n(जाँच: a = 6, b = 2 ⇒ 36 + 4 = 40 ✔)", "source": "NCERT कक्षा 9 गणित, अध्याय 'बहुपद' (बीजीय सर्वसमिकाएँ)"}, {"n": 87, "section": "प्रारंभिक गणित", "q": "840 के कितने धनात्मक गुणनखंड हैं?", "options": ["28", "24", "32", "36", "उपर्युक्त में से कोई नहीं"], "answer": 2, "explain": "अभाज्य गुणनखंडन: 840 = 2³ × 3¹ × 5¹ × 7¹\nगुणनखंडों की संख्या = (3+1)(1+1)(1+1)(1+1)\n= 4 × 2 × 2 × 2 = 32", "source": "NCERT कक्षा 10 गणित, अध्याय 1 'वास्तविक संख्याएँ' (अंकगणित की आधारभूत प्रमेय)"}, {"n": 88, "section": "प्रारंभिक गणित", "q": "एक माली बराबर पंक्तियों और स्तंभों वाली एक वर्गाकार ग्रिड में 1000 पेड़ लगाता है। सबसे बड़ा संभव वर्ग बनाने के बाद कितने पेड़ शेष रहेंगे?", "options": ["24", "31", "16", "39", "उपर्युक्त में से कोई नहीं"], "answer": 3, "explain": "1000 से छोटा सबसे बड़ा पूर्ण वर्ग:\n31² = 961, 32² = 1024 (> 1000)\n⇒ 31 × 31 का वर्ग बनेगा = 961 पेड़\nशेष = 1000 − 961 = 39", "source": "NCERT कक्षा 8 गणित, अध्याय 'वर्ग और वर्गमूल'"}, {"n": 89, "section": "प्रारंभिक गणित", "q": "एक शहर की जनसंख्या में प्रति वर्ष 2.5% की वृद्धि होती है, जबकि प्रवासन के कारण यह प्रति वर्ष 0.5% कम हो जाती है। दो वर्षों के बाद जनसंख्या में कुल प्रतिशत वृद्धि क्या होगी?", "options": ["5.06%", "3.98%", "4.04%", "6.09%", "उपर्युक्त में से कोई नहीं"], "answer": 2, "explain": "शुद्ध वार्षिक वृद्धि = 2.5% − 0.5% = 2%\n2 वर्ष बाद (चक्रवृद्धि): (1.02)² = 1.0404\n⇒ कुल वृद्धि = 4.04%\nशॉर्टकट: x + y + xy/100 = 2 + 2 + (2×2)/100 = 4.04%", "source": "NCERT कक्षा 8 गणित, अध्याय 'राशियों की तुलना' (चक्रवृद्धि / जनसंख्या वृद्धि)"}, {"n": 90, "section": "प्रारंभिक गणित", "q": "आठ संख्याओं 6, 11, 9, x, 8, 10, 7, 13 का औसत (माध्य) 10 है। x का मान क्या है?", "options": ["13", "12", "16", "14", "उपर्युक्त में से कोई नहीं"], "answer": 2, "explain": "कुल योग = औसत × संख्या = 10 × 8 = 80\nज्ञात संख्याओं का योग = 6 + 11 + 9 + 8 + 10 + 7 + 13 = 64\nx = 80 − 64 = 16", "source": "NCERT कक्षा 9 गणित, अध्याय 'सांख्यिकी' (माध्य)"}, {"n": 91, "section": "आँकड़ा विश्लेषण", "q": "शाखाओं B और D में शाम की शिफ्ट के दौरान सेवा पाने वाले ग्राहकों की कुल संख्या और शाखाओं C और E में सुबह की शिफ्ट के दौरान सेवा पाने वाले ग्राहकों की संख्या का अनुपात क्या है?", "options": ["19 : 16", "16 : 15", "18 : 17", "15 : 14", "उपर्युक्त में से कोई नहीं"], "answer": 1, "explain": "B + D (शाम) = 260 + 380 = 640\nC + E (सुबह) = 250 + 350 = 600\nअनुपात = 640 : 600 = (÷40) 16 : 15", "source": "", "ctx": "बार ग्राफ (Q91–95): शाखाओं में सुबह और शाम की शिफ्ट में सेवा पाने वाले ग्राहक\nशाखा   सुबह   शाम\nA      150    210\nB      200    260\nC      250    320\nD      300    380\nE      350    440"}, {"n": 92, "section": "आँकड़ा विश्लेषण", "q": "यदि शाखा C में सुबह की शिफ्ट के दौरान सेवा पाने वाले ग्राहकों की संख्या 20% बढ़ जाती है, जबकि शाम की शिफ्ट की संख्या में कोई बदलाव नहीं होता है, तो शाखा C में शाम की शिफ्ट की संख्या, संशोधित सुबह की शिफ्ट की संख्या से कितने प्रतिशत अधिक होगी?", "options": ["7⅓%", "6⅔%", "5⅓%", "4½%", "उपर्युक्त में से कोई नहीं"], "answer": 1, "explain": "C सुबह (नया) = 250 × 1.2 = 300\nC शाम = 320\nअधिक = 320 − 300 = 20\nप्रतिशत = (20 / 300) × 100 = 6.67% = 6⅔%", "source": "", "ctx": "बार ग्राफ (Q91–95): शाखाओं में सुबह और शाम की शिफ्ट में सेवा पाने वाले ग्राहक\nशाखा   सुबह   शाम\nA      150    210\nB      200    260\nC      250    320\nD      300    380\nE      350    440"}, {"n": 93, "section": "आँकड़ा विश्लेषण", "q": "सभी पाँच शाखाओं में शाम की शिफ्ट के कुल ग्राहकों का कौन-सा अंश (भिन्न) शाखाओं D और E में मिलकर सेवा प्राप्त ग्राहकों का था?", "options": ["80/161", "84/161", "75/161", "82/161", "उपर्युक्त में से कोई नहीं"], "answer": 3, "explain": "कुल शाम = 210 + 260 + 320 + 380 + 440 = 1610\nD + E (शाम) = 380 + 440 = 820\nअंश = 820/1610 = (÷10) 82/161", "source": "", "ctx": "बार ग्राफ (Q91–95): शाखाओं में सुबह और शाम की शिफ्ट में सेवा पाने वाले ग्राहक\nशाखा   सुबह   शाम\nA      150    210\nB      200    260\nC      250    320\nD      300    380\nE      350    440"}, {"n": 94, "section": "आँकड़ा विश्लेषण", "q": "यदि शाम की शिफ्ट के 40 ग्राहकों को शाखा E से शाखा A में स्थानांतरित किया जाता है, तो शाखा A और शाखा E में शाम की शिफ्ट के ग्राहकों की संशोधित संख्या का अनुपात ज्ञात कीजिए।", "options": ["5 : 8", "1 : 2", "3 : 5", "3 : 4", "उपर्युक्त में से कोई नहीं"], "answer": 0, "explain": "A (शाम, नया) = 210 + 40 = 250\nE (शाम, नया) = 440 − 40 = 400\nअनुपात = 250 : 400 = (÷50) 5 : 8", "source": "", "ctx": "बार ग्राफ (Q91–95): शाखाओं में सुबह और शाम की शिफ्ट में सेवा पाने वाले ग्राहक\nशाखा   सुबह   शाम\nA      150    210\nB      200    260\nC      250    320\nD      300    380\nE      350    440"}, {"n": 95, "section": "आँकड़ा विश्लेषण", "q": "यदि शाखा A में सुबह की शिफ्ट के ग्राहकों की संख्या दोगुनी हो जाए और शाखा E में यह संख्या 20% कम हो जाए, तो इन दोनों शाखाओं में सुबह की शिफ्ट के ग्राहकों की संशोधित संख्या के बीच कितना अंतर है?", "options": ["40", "30", "20", "10", "उपर्युक्त में से कोई नहीं"], "answer": 2, "explain": "A सुबह (नया) = 150 × 2 = 300\nE सुबह (नया) = 350 × 0.8 = 280\nअंतर = 300 − 280 = 20", "source": "", "ctx": "बार ग्राफ (Q91–95): शाखाओं में सुबह और शाम की शिफ्ट में सेवा पाने वाले ग्राहक\nशाखा   सुबह   शाम\nA      150    210\nB      200    260\nC      250    320\nD      300    380\nE      350    440"}, {"n": 96, "section": "भारतीय अर्थव्यवस्था", "q": "निम्नलिखित में से किस कर को वस्तु एवं सेवा कर (GST) में समाहित कर लिया गया था?", "options": ["चुंगी (ऑक्ट्रॉय)", "आयकर (इनकम टैक्स)", "संपत्ति कर (वेल्थ टैक्स)", "स्टाम्प शुल्क (स्टाम्प ड्यूटी)", "उपर्युक्त में से कोई नहीं"], "answer": 0, "explain": "GST (1 जुलाई 2017, 101वाँ संविधान संशोधन) में चुंगी/प्रवेश कर, VAT, उत्पाद शुल्क, सेवा कर आदि समाहित हुए। आयकर प्रत्यक्ष कर है; स्टाम्प शुल्क GST से बाहर है; वेल्थ टैक्स 2015 में समाप्त।", "source": "GST Council — gstcouncil.gov.in (Taxes subsumed); CBIC"}, {"n": 97, "section": "भारतीय अर्थव्यवस्था", "q": "निम्नलिखित में से किस समिति ने राष्ट्रीय कृषि और ग्रामीण विकास बैंक (नाबार्ड) की स्थापना की सिफारिश की थी?", "options": ["एम. नरसिम्हम समिति", "ए.एम. खुसरो समिति", "वाई.वी. रेड्डी समिति", "बी. शिवरामन समिति", "उपर्युक्त में से कोई नहीं"], "answer": 3, "explain": "RBI द्वारा गठित CRAFICARD (अध्यक्ष बी. शिवरामन, 1979) की सिफारिश पर 12 जुलाई 1982 को NABARD बना।", "source": "NABARD — nabard.org (About Us / History)"}, {"n": 98, "section const L="ABCDE",Q=D.qs,M=D.meta,NEG=+M.negative||0;let ans={},cur=0,left=(M.minutes||Q.length)*60,tmr=null,done=false;
const $=s=>document.querySelector(s),esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const links=`<div class="links"><a href="https://t.me/examhub2026" target="_blank">✈️ Telegram</a><a href="https://erojgarresult.com/exam-hub/" target="_blank">🌐 Website par rank dekhein</a></div>`;
const mmss=s=>String(Math.floor(Math.max(0,s)/60)).padStart(2,"0")+":"+String(Math.max(0,s)%60).padStart(2,"0");
function intro(){$("#app").innerHTML=`<div class="card intro"><h1>${esc(M.title)}</h1><p>${Q.length} प्रश्न · ${M.minutes||Q.length} मिनट · सही +1 · गलत −${NEG}</p>${M.note?`<p style="color:#b35d00">${esc(M.note)}</p>`:""}<button class="btn" onclick="start()">टेस्ट शुरू करें</button></div>${links}`;}
function start(){tmr=setInterval(()=>{left--;$("#tm").textContent="⏱ "+mmss(left);if(left<=0)submit()},1000);$("#tm").textContent="⏱ "+mmss(left);draw();}
function draw(){const q=Q[cur];$("#app").innerHTML=`<div class="lay"><div class="card"><div class="row"><b style="flex:1">प्रश्न ${cur+1} / ${Q.length}</b>${q.section?`<span class="src">${esc(q.section)}</span>`:""}</div>
${q.ctx?`<div class="ctx">${esc(q.ctx)}</div>`:""}<p class="q">${esc(q.q)}</p>${q.options.map((o,i)=>`<button class="opt ${ans[cur]===i?"sel":""}" onclick="pick(${i})"><span class="k">${L[i]}</span>${esc(o)}</button>`).join("")}
<div class="row"><button class="btn g" onclick="mv(-1)">← पिछला</button><button class="btn" onclick="mv(1)">${cur<Q.length-1?"अगला →":"Submit"}</button></div></div>
<div class="card"><b>Question palette</b><div class="pal" style="margin:8px 0">${Q.map((_,i)=>`<button class="${ans[i]!==undefined?"a":""} ${i===cur?"c":""}" onclick="cur=${i};draw()">${i+1}</button>`).join("")}</div>
<p class="src">${Object.keys(ans).length} उत्तर दिए · ${Q.length-Object.keys(ans).length} बाकी</p><button class="btn alt" style="width:100%" onclick="if(confirm('Test submit karein?'))submit()">Submit</button></div></div>`;}
function pick(i){if(ans[cur]===i)delete ans[cur];else ans[cur]=i;draw();}
function mv(d){if(d>0&&cur===Q.length-1){if(confirm('Test submit karein?'))submit();return}cur=Math.min(Q.length-1,Math.max(0,cur+d));draw();}
function submit(){if(done)return;done=true;clearInterval(tmr);let r=0,w=0;Q.forEach((q,i)=>{if(ans[i]===undefined)return;ans[i]===q.answer?r++:w++});const sc=r-w*NEG;
$("#tm").textContent="";$("#app").innerHTML=`<div class="card" style="text-align:center"><h2 style="margin:0">${(+sc.toFixed(2))} / ${Q.length}</h2><p>${esc(M.title)}</p>
<div class="stats"><div><b style="color:var(--ok)">${r}</b>सही</div><div><b style="color:var(--bad)">${w}</b>गलत</div><div><b>${Q.length-r-w}</b>छोड़े</div><div><b>${mmss((M.minutes||Q.length)*60-left)}</b>समय</div></div>
<p style="margin-top:10px">All-UP rank ke liye yahi test <a href="https://erojgarresult.com/exam-hub/" style="color:var(--b);font-weight:700">Exam Hub website</a> ya app me dein.</p></div>${links}
${Q.map((q,i)=>{const a=ans[i];return `<div class="card"><b>प्रश्न ${i+1}. ${esc(q.q)}</b><div style="margin-top:8px">${q.options.map((o,j)=>`<div class="opt ${j===q.answer?"r":(j===a?"w":"")}"><span class="k">${L[j]}</span>${esc(o)}</div>`).join("")}</div>
${q.explain?`<div class="ex"><b>व्याख्या:</b> ${esc(q.explain)}</div>`:""}${q.source?`<p class="src"><b>स्रोत:</b> ${esc(q.source)}</p>`:""}</div>`}).join("")}`;scrollTo(0,0);}
intro();
</script></body></html>
