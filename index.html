<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exam Hub – UPSSSC, UPPSC Mock Test, Quiz, PDF</title>
<meta name="description" content="UPSSSC, UPPSC, UP Police, Super TET ke liye free mock test, daily quiz, PDF notes aur All-UP rank. Exam Hub app ka website version.">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;600;700&display=swap">
<style>
/* Same look as the Exam Hub app: brand green from the Telegram DP, saffron accent. */
:root{
  --bg:#f2f5f4; --surface:#fff; --surface2:#eef2f0; --ink:#0f1f1b; --muted:#5f6e6a; --line:#e0e7e4;
  --brand:#015a3e; --brand2:#013a28; --brand-soft:#e0efe9; --acc:#ec8516; --acc-soft:#fdf0e1;
  --ok:#1d8a4b; --bad:#c9372c; --tg:#229ed9;
  --display:"Baloo 2","Mukta",system-ui,sans-serif; --body:"Mukta",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1210; --surface:#141e1b; --surface2:#1b2724; --ink:#e6efec; --muted:#93a39f; --line:#26332f;
  --brand:#2fb383; --brand2:#0d3b2c; --brand-soft:#16342a; --acc:#ffa142; --acc-soft:#2f2213; --ok:#43c27a; --bad:#f06a5f;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15}
button,a{font:inherit;color:inherit;cursor:pointer}
button{border:0;background:none}
a{text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left))}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand img{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);object-fit:contain}
.brand b{font:800 22px var(--display)}
.pill{border-radius:99px;padding:8px 16px;font-weight:700;font-size:14px}
.pill.brand-bg{background:var(--brand);color:#fff}
.pill.ghost{border:1px solid var(--line);background:var(--surface)}
.av{width:40px;height:40px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font:800 17px var(--display)}
main{padding-block:18px 60px;display:flex;flex-direction:column;gap:22px}
/* slider */
.live{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;min-height:220px}
.slides{display:flex;transition:transform .5s ease}
.slide{flex:0 0 100%;min-height:220px;position:relative;text-align:left;color:#fff;display:flex;align-items:flex-end;padding:22px 22px 40px}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide.has-img::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 20%,rgba(0,0,0,.75))}
.slide .tx{position:relative;z-index:1;max-width:640px;display:flex;flex-direction:column;gap:6px}
.tag{align-self:flex-start;background:rgba(255,255,255,.18);border-radius:99px;padding:2px 12px;font-size:13px;font-weight:700}
.slide h2{font-size:clamp(22px,3.4vw,32px)}
.slide p{margin:0;opacity:.85}
.badge-live{position:absolute;top:14px;left:14px;z-index:2;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.28);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700;letter-spacing:.08em}
.badge-live i{width:8px;height:8px;border-radius:50%;background:#ff5a4e;animation:pl 1.6s infinite}
@keyframes pl{70%{box-shadow:0 0 0 8px rgba(255,90,78,0)}0%{box-shadow:0 0 0 0 rgba(255,90,78,.7)}}
.dots{position:absolute;left:22px;bottom:14px;z-index:2;display:flex;gap:6px}
.dots button{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.4);transition:width .3s}
.dots button.on{width:20px;background:#fff}
.tick{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 14px;overflow:hidden}
.tick b{color:var(--bad);font-size:13px;letter-spacing:.06em;flex:none}
.tick .tw{overflow:hidden;flex:1;min-width:0}
.tick .tr{display:inline-block;white-space:nowrap;animation:mq 30s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.sech{display:flex;justify-content:space-between;align-items:center}
.sech h2{font-size:22px}
.exrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.ex{flex:none;width:140px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px}
.ex .m{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font:800 14px var(--display);overflow:hidden}
.ex .m img{width:100%;height:100%;object-fit:cover}
.ex b{font:700 17px var(--display)}
.ex small{color:var(--muted);line-height:1.25}
.ex.feat{border-color:var(--acc);background:var(--acc-soft)}
.ex.on{border:2px solid var(--brand);background:var(--brand-soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:center;font-weight:600;font-size:14px}
.tile .ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:26px;overflow:hidden}
.tile .ic img{width:100%;height:100%;object-fit:cover}
.tile:hover{border-color:var(--brand)}
.tg{display:flex;align-items:center;gap:14px;background:var(--tg);color:#fff;border-radius:20px;padding:16px 18px}
.tg b{font:700 18px var(--display);display:block}
.tg .pill{background:#fff;color:#1a86ba;margin-left:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.list{display:flex;flex-direction:column;gap:10px}
.li{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;width:100%}
.li .bx{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--brand-soft);flex:none}
.li .x{flex:1;min-width:0}
.li .x b{display:block;font-weight:600}
.li .x small{color:var(--muted)}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:700;background:var(--acc-soft);color:var(--acc);flex:none}
.chip.g{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--brand)}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--brand);color:#fff;border-radius:14px;padding:12px 18px;font-weight:700}
.btn.alt{background:var(--acc)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* test */
.tbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.timer{font:800 22px var(--display);color:var(--acc);font-variant-numeric:tabular-nums}
.prog{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand)}
.q{font-size:20px;font-weight:600;margin:0}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font-weight:500}
.opt .k{width:30px;height:30px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;font-weight:700;flex:none}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)} .opt.sel .k{background:var(--brand);color:#fff}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))} .opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))} .opt.wrong .k{background:var(--bad);color:#fff}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.pal button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);font-weight:700;background:var(--surface)}
.pal button.a{background:var(--brand);border-color:var(--brand);color:#fff}
.pal button.c{outline:2px solid var(--acc)}
.layout{display:grid;grid-template-columns:1fr 280px;gap:18px;align-items:start}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats div{background:var(--surface2);border-radius:12px;padding:10px}
.stats b{font:800 22px var(--display);display:block}
.stats span{font-size:13px;color:var(--muted)}
.big{font:800 40px var(--display);color:var(--brand)}
.expl{background:var(--brand-soft);border-radius:14px;padding:12px 14px}
/* viewer */
.viewer{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
.viewer .vb{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#111;color:#fff}
.viewer .vb b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer .vb a,.viewer .vb button{color:#fff;background:#2a2a2a;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700}
.viewer iframe{flex:1;border:0;width:100%;background:#fff}
.viewer .imgs{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center}
.viewer .imgs img{max-width:100%;transform-origin:top center}
/* login */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px}
.modal .in{background:var(--surface);border-radius:22px;padding:22px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px}
.modal input{font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:13px;font-weight:700;background:var(--surface)}
.gdot{width:20px;height:20px;border-radius:50%;background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0)}
.err{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;z-index:70}
footer{color:var(--muted);font-size:13px;text-align:center;padding:30px 0}
.notes{white-space:pre-wrap;font-size:17px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#" data-go="home"><img src="logo.png" alt=""><b id="appName">Exam Hub</b></a>
  <a class="pill ghost" id="appLink" href="https://play.google.com/store/apps/details?id=com.upboardprep" target="_blank" rel="noopener">📱 App</a>
  <button class="av" id="avatar" aria-label="Login / Profile">?</button>
</div></header>
<main class="wrap" id="main"><p class="empty">Load ho raha hai…</p></main>
<footer class="wrap">Exam Hub ek swatantra study platform hai, kisi sarkari sanstha se juda nahi. · <a href="https://erojgarresult.com" style="color:var(--brand)">erojgarresult.com</a></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== Firebase web config (Firebase console → Project settings → Your apps → Web app). Not a secret. */
const FIREBASE_CONFIG = window.EXAMHUB_FIREBASE || {
  apiKey: "AIzaSyDzy_mgtl_a4KTP5tb0Cj3GgqHfCsI3VrQ",
  authDomain: "up-board-hub.firebaseapp.com",
  projectId: "up-board-hub",
  storageBucket: "up-board-hub.firebasestorage.app",
  messagingSenderId: "780625072062",
  appId: "1:780625072062:web:1e69a821c0253c1233b3ef",
};
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth(), db = firebase.firestore();

const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S = { settings:{}, exams:[], sections:[], updates:[], exam:localStorageGet("exam"), user:null, slide:0, view:["home"] };
function localStorageGet(k){ try { return localStorage.getItem("eh_"+k) || ""; } catch(e){ return ""; } }
function localStorageSet(k,v){ try { localStorage.setItem("eh_"+k,v); } catch(e){} }
function toast(m){ const d=document.createElement("div"); d.className="toast"; d.textContent=m; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }
const ALLOWED = ["test","quiz","pdf","image","notes","pyq","handwritten","ask"];
const TYPE_ICON = {test:"📝",quiz:"❓",pdf:"📄",image:"🖼️",notes:"📰",pyq:"🗂️",handwritten:"✍️",ask:"💬"};

/* ---------- links (Drive share links → viewer / image / download) */
function driveId(u){ const m=String(u).match(/(?:\/d\/|id=)([\w-]{20,})/); return m && /drive\.google|docs\.google/.test(u) ? m[1] : null; }
function imgUrl(u){ const id=driveId(u); return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1600` : u; }
function pdfView(u){ const id=driveId(u); return id ? `https://drive.google.com/file/d/${id}/preview` : `https://mozilla.github.io/pdf.js/web/viewer.html?file=${encodeURIComponent(u)}`; }
function pdfDownload(u){ const id=driveId(u); return id ? `https://drive.google.com/uc?export=download&id=${id}` : u; }

/* ---------- data */
async function loadHome(){
  const [st, ex, sec, up] = await Promise.all([
    db.doc("settings/app").get().catch(()=>null),
    db.collection("classes").where("draft","==",false).get(),
    db.collection("sections").where("draft","==",false).get(),
    db.collection("updates").where("draft","==",false).get().catch(()=>({docs:[]})),
  ]);
  S.settings = (st && st.exists) ? st.data() : {};
  S.exams = ex.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
  S.sections = sec.docs.map(d=>({id:d.id,...d.data()})).filter(s=>ALLOWED.includes(s.type)).sort((a,b)=>(a.order||0)-(b.order||0));
  S.updates = up.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
  if (!S.exams.some(e=>e.id===S.exam) && S.exams.length) S.exam=(S.exams.find(e=>e.featured)||S.exams[0]).id;
  $("#appName").textContent = S.settings.appName || "Exam Hub";
  if (S.settings.primary && /^#[0-9a-f]{6}$/i.test(S.settings.primary) && S.settings.primary.toLowerCase()!=="#0f5f53")
    document.documentElement.style.setProperty("--brand", S.settings.primary);
}
async function sectionItems(examId, sec){
  const subs = await db.collection(`classes/${examId}/subjects`).where("draft","==",false).get();
  const out = [];
  await Promise.all(subs.docs.map(async s => {
    const chs = await s.ref.collection("chapters").where("draft","==",false).get();
    await Promise.all(chs.docs.map(async c => {
      const cs = await c.ref.collection("content").where("draft","==",false).get();
      cs.docs.forEach(d => {
        const x = d.data();
        if (x.sectionId===sec.id || (!x.sectionId && x.type===sec.type))
          out.push({id:d.id, path:`${examId}/${s.id}/${c.id}/${d.id}`, subject:s.data().title_hi||s.data().title_en, chapter:c.data().title_hi||c.data().title_en, ...x});
      });
    }));
  }));
  return out.sort((a,b)=>(a.order||0)-(b.order||0));
}
const title = x => x.title_hi || x.title_en || x.name_hi || x.name_en || "";

/* ---------- router */
function go(...v){ S.view=v; render(); scrollTo(0,0); }
function gated(fn){ if (S.user && !S.user.isAnonymous) fn(); else loginModal(fn); }

async function render(){
  const [v, ...a] = S.view, m = $("#main");
  try {
    if (v==="home") m.innerHTML = homeHTML();
    else if (v==="section") await renderSection(a[0]);
    else if (v==="test") renderTest();
    else if (v==="quiz") renderQuiz();
    else if (v==="result") renderResult();
    else if (v==="notes") renderNotes(a[0]);
    else if (v==="profile") renderProfile();
  } catch(e){ m.innerHTML = `<div class="card"><b>Load nahi hua</b><p>${esc(e.message)}</p><button class="btn" data-go="home">Home</button></div>`; }
}

/* ---------- home */
function homeHTML(){
  const U=S.updates.length?S.updates:[{title:"UPSSSC · UPPSC ki poori taiyari",subtitle:"Mock test, quiz, PDF aur current affairs ek jagah",tag:"Exam Hub"}];
  const ex=S.exams.find(e=>e.id===S.exam);
  const tgUrl=S.settings.telegramUrl||"https://t.me/examhub2026";
  return `
  <section class="live" aria-label="Live update">
    <span class="badge-live"><i></i>LIVE UPDATE</span>
    <div class="slides" id="slides">${U.map((u,i)=>`<button class="slide ${u.imageUrl?"has-img":""}" data-upd="${i}">${u.imageUrl?`<img src="${esc(imgUrl(u.imageUrl))}" alt="">`:""}<span class="tx">${u.tag?`<span class="tag">${esc(u.tag)}</span>`:""}<h2>${esc(u.title)}</h2>${u.subtitle?`<p>${esc(u.subtitle)}</p>`:""}</span></button>`).join("")}</div>
    <div class="dots" id="dots">${U.map((_,i)=>`<button class="${i?"":"on"}" data-dot="${i}" aria-label="Update ${i+1}"></button>`).join("")}</div>
  </section>
  ${S.updates.length?`<div class="tick"><b>${esc(S.settings.tickerLabel||"BREAKING")}</b><span class="tw"><span class="tr">${esc((S.updates.map(u=>u.title).join("   •   ")+"   •   ").repeat(2))}</span></span></div>`:""}
  <div class="sech"><h2>Exam chuniye</h2></div>
  <div class="exrow">${S.exams.map(e=>`<button class="ex ${e.id===S.exam?"on":e.featured?"feat":""}" data-exam="${e.id}"><span class="m" style="background:${esc(e.color||"#0f7a69")}">${e.imageUrl?`<img src="${esc(imgUrl(e.imageUrl))}" alt="">`:esc((e.name_en||"").replace(/[^A-Za-z]/g,"").slice(0,2).toUpperCase())}</span><b>${esc(title(e))}</b><small>${esc(e.subtitle||"")}</small></button>`).join("")}</div>
  ${ex?`<div class="sech"><h2>${esc(title(ex))} ki taiyari</h2></div>
  <div class="grid">${S.sections.map(s=>`<button class="tile" data-sec="${s.id}"><span class="ic" style="background:color-mix(in srgb,${esc(s.color||"#2f63d6")} 16%,var(--surface))">${s.imageUrl?`<img src="${esc(imgUrl(s.imageUrl))}" alt="">`:esc(s.emoji||TYPE_ICON[s.type]||"📘")}</span>${esc(s.title_hi||s.title_en)}</button>`).join("")}
    <a class="tile" href="${esc(tgUrl)}" target="_blank" rel="noopener"><span class="ic" style="background:color-mix(in srgb,#229ed9 16%,var(--surface))">✈️</span>Telegram</a></div>`:`<p class="empty">Abhi koi exam nahi joda gaya.</p>`}
  <a class="tg" href="${esc(tgUrl)}" target="_blank" rel="noopener"><span style="font-size:28px">✈️</span><span><b>Telegram channel join karein</b><small>${esc(S.settings.telegramName||"@examhub2026")} · roz ki update</small></span><span class="pill">Join</span></a>`;
}
function setSlide(i){ const n=Math.max(1,S.updates.length||1); S.slide=(i+n)%n; const sl=$("#slides"); if(!sl) return; sl.style.transform=`translateX(-${S.slide*100}%)`; document.querySelectorAll("#dots button").forEach((b,j)=>b.classList.toggle("on",j===S.slide)); }
setInterval(()=>{ if(S.view[0]==="home") setSlide(S.slide+1); }, 5000);
function openUpdate(u){
  const l=(u.link||"").trim();
  if (l.startsWith("section:")) return gated(()=>go("section", l.slice(8)));
  if (l.startsWith("exam:")) { S.exam=l.slice(5); localStorageSet("exam",S.exam); return go("home"); }
  if (l.startsWith("http")) return window.open(l, "_blank", "noopener");
  toast(u.body || u.subtitle || u.title);
}

/* ---------- section list */
async function renderSection(secId){
  const sec=S.sections.find(s=>s.id===secId), ex=S.exams.find(e=>e.id===S.exam), m=$("#main");
  if (!sec || !ex) return go("home");
  m.innerHTML=`<button class="back" data-go="home">← Wapas</button><h1>${esc(ex.name_en)} · ${esc(sec.title_hi||sec.title_en)}</h1><p class="empty">Load ho raha hai…</p>`;
  const items = S.items = await sectionItems(ex.id, sec);
  m.innerHTML=`<button class="back" data-go="home">← Wapas</button><h1>${esc(ex.name_en)} · ${esc(sec.title_hi||sec.title_en)}</h1>
  <div class="list">${items.length?items.map((it,i)=>{
    const q=(it.questions||[]).length, t=it.type;
    const sub = t==="test" ? `${q} प्रश्न · ${it.minutes||q} मिनट${it.negative?` · −${it.negative}`:""}` : t==="quiz" ? `${q} प्रश्न · turant uttar` : t==="image"||t==="handwritten" ? `${(it.images||[it.url]).filter(Boolean).length} photo` : (it.subject||"");
    return `<button class="li" data-item="${i}"><span class="bx">${TYPE_ICON[t]||"📘"}</span><span class="x"><b>${esc(title(it))}</b><small>${esc(sub)}${it.chapter&&it.chapter!=="सभी"?" · "+esc(it.chapter):""}</small></span><span class="chip g">${t==="test"?"Shuru":t==="quiz"?"Khelo":"Kholo"}</span></button>`;
  }).join(""):`<p class="empty">Is section me abhi kuch nahi hai. Jaldi aayega.</p>`}</div>`;
}
function openItem(it){
  const t=it.type;
  if (t==="test") { S.run={it, ans:{}, cur:0, left:(it.minutes||(it.questions||[]).length)*60}; startTimer(); return go("test"); }
  if (t==="quiz") { S.qz={it, i:0, pick:null, score:0}; return go("quiz"); }
  if (t==="pdf" || (t==="pyq" && it.url)) return openPdf(it);
  if (t==="image" || t==="handwritten") return openImages(it);
  if (t==="ask") return toast("Sawal poochhne ke liye Exam Hub app istemal karein");
  S.note=it; go("notes");
}

/* ---------- viewers */
async function openPdf(it){
  let url = it.url;
  if (!url && it.pdfId) { const d=await db.doc("pdfs/"+it.pdfId).get(); url=d.exists?d.data().url:""; }
  if (!url) return toast("PDF ka link nahi mila");
  const v=document.createElement("div"); v.className="viewer";
  v.innerHTML=`<div class="vb"><button data-close>✕</button><b>${esc(title(it))}</b><a href="${esc(pdfDownload(url))}" target="_blank" rel="noopener" download>⬇ Download</a><a href="${esc(url)}" target="_blank" rel="noopener">Open</a><button data-fs>⛶</button></div><iframe src="${esc(pdfView(url))}" allow="fullscreen" title="PDF"></iframe>`;
  document.body.appendChild(v);
}
function openImages(it){
  const pics=(it.images&&it.images.length?it.images:[it.url]).filter(Boolean);
  let i=0, z=1;
  const v=document.createElement("div"); v.className="viewer";
  const draw=()=>{ v.querySelector(".imgs").innerHTML=`<img src="${esc(imgUrl(pics[i]))}" style="transform:scale(${z})" alt="">`; v.querySelector("#pc").textContent=`${i+1}/${pics.length}`; };
  v.innerHTML=`<div class="vb"><button data-close>✕</button><b>${esc(title(it))}</b><span id="pc"></span><button data-p>◀</button><button data-n>▶</button><button data-zo>−</button><button data-zi>+</button><a target="_blank" rel="noopener" data-dl>⬇</a></div><div class="imgs"></div>`;
  document.body.appendChild(v); draw();
  v.addEventListener("click",e=>{ const b=e.target.closest("button,a"); if(!b) return;
    if(b.dataset.p!==undefined){i=(i-1+pics.length)%pics.length;z=1;draw();}
    if(b.dataset.n!==undefined){i=(i+1)%pics.length;z=1;draw();}
    if(b.dataset.zi!==undefined){z=Math.min(5,z+0.5);draw();}
    if(b.dataset.zo!==undefined){z=Math.max(1,z-0.5);draw();}
    if(b.dataset.dl!==undefined){b.href=pics[i];}
  });
}
function renderNotes(){
  const it=S.note; $("#main").innerHTML=`<button class="back" data-back>← Wapas</button><article class="card"><h1>${esc(title(it))}</h1><p class="notes">${esc(it.body_hi||it.body_en||"")}</p></article>`;
}

/* ---------- mock test */
let tmr=null;
function startTimer(){ clearInterval(tmr); tmr=setInterval(()=>{ const r=S.run; if(!r) return clearInterval(tmr); r.left--; const t=$("#timer"); if(t) t.textContent=mmss(r.left); if(r.left<=0) submitTest(); },1000); }
const mmss=s=>`${String(Math.floor(Math.max(0,s)/60)).padStart(2,"0")}:${String(Math.max(0,s)%60).padStart(2,"0")}`;
function renderTest(){
  const r=S.run, qs=r.it.questions||[], q=qs[r.cur];
  $("#main").innerHTML=`<div class="tbar"><button class="back" data-exit>✕ Chhodein</button><h2 style="flex:1">${esc(title(r.it))}</h2><span class="timer">⏱ <span id="timer">${mmss(r.left)}</span></span></div>
  <div class="layout"><div class="card" style="display:flex;flex-direction:column;gap:14px">
    <div class="prog"><i style="width:${(r.cur+1)/qs.length*100}%"></i></div>
    <div class="row"><b style="flex:1">प्रश्न ${r.cur+1} / ${qs.length}</b>${r.it.negative?`<span class="chip">+1 / −${r.it.negative}</span>`:""}</div>
    <p class="q" style="white-space:pre-line">${esc(q.q_hi||q.q)}</p>
    <div class="list">${(q.options_hi&&q.options_hi.length?q.options_hi:q.options).map((o,i)=>`<button class="opt ${r.ans[r.cur]===i?"sel":""}" data-opt="${i}"><span class="k">${"ABCDE"[i]}</span>${esc(o)}</button>`).join("")}</div>
    <div class="row"><button class="btn ghost" data-prev ${r.cur?"":"disabled"}>← पिछला</button><button class="btn" data-next>${r.cur<qs.length-1?"अगला →":"Submit"}</button></div>
  </div>
  <aside class="card"><b>Question palette</b><div class="pal" style="margin:10px 0">${qs.map((_,i)=>`<button class="${r.ans[i]!==undefined?"a":""} ${i===r.cur?"c":""}" data-q="${i}">${i+1}</button>`).join("")}</div>
  <p style="color:var(--muted);font-size:14px">${Object.keys(r.ans).length} uttar diye · ${qs.length-Object.keys(r.ans).length} baaki</p><button class="btn alt" style="width:100%" data-submit>Test Submit karein</button></aside></div>`;
}
async function submitTest(){
  clearInterval(tmr);
  const r=S.run, qs=r.it.questions||[], total=(r.it.minutes||qs.length)*60;
  let right=0, wrong=0; qs.forEach((q,i)=>{ if(r.ans[i]===undefined) return; r.ans[i]===q.answer?right++:wrong++; });
  const score=right-wrong*(r.it.negative||0);
  S.res={it:r.it, ans:r.ans, right, wrong, skip:qs.length-right-wrong, score, secs:total-Math.max(0,r.left), rank:null};
  S.run=null; go("result");
  try {
    const col=db.collection("results").doc(r.it.path.replaceAll("/","_")).collection("attempts");
    await col.doc(S.user.uid).set({score,right,wrong,total:qs.length,name:S.user.displayName||"",seconds:S.res.secs,at:Date.now(),via:"web"});
    const above=(await col.where("score",">",score).count().get()).data().count;
    const all=(await col.count().get()).data().count;
    S.res.rank={rank:above+1,total:all}; if(S.view[0]==="result") renderResult();
  } catch(e){ console.warn("rank",e); }
}
function renderResult(){
  const r=S.res, qs=r.it.questions||[], pct=Math.max(0,Math.round(r.score/qs.length*100));
  $("#main").innerHTML=`<button class="back" data-back>← Wapas</button>
  <div class="card" style="text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center">
    <div style="width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--brand) ${pct}%,var(--surface2) 0)"><div style="width:118px;height:118px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:800 30px var(--display)">${+r.score.toFixed(2)}/${qs.length}</div></div>
    <h2>${esc(title(r.it))}</h2>
    <div class="stats" style="width:100%"><div><b style="color:var(--ok)">${r.right}</b><span>Sahi</span></div><div><b style="color:var(--bad)">${r.wrong}</b><span>Galat</span></div><div><b>${r.skip}</b><span>Chhoda</span></div><div><b>${mmss(r.secs)}</b><span>Samay</span></div></div>
  </div>
  <div class="card"><span style="color:var(--muted);font-weight:700">AAPKI RANK</span><div class="big">${r.rank?`#${r.rank.rank} <small style="font-size:16px;color:var(--muted)">/ ${r.rank.total}</small>`:"…"}</div>${r.rank?`<small>${(100*(r.rank.total-r.rank.rank)/Math.max(1,r.rank.total)).toFixed(1)} percentile</small>`:""}</div>
  <h2>Uttar aur vyakhya</h2>
  <div class="list">${qs.map((q,i)=>{ const a=r.ans[i], O=q.options_hi&&q.options_hi.length?q.options_hi:q.options;
    return `<div class="card"><b>Q${i+1}. ${esc(q.q_hi||q.q)}</b><p style="margin:6px 0 0">${a===undefined?`<span style="color:var(--acc)">Chhoda</span> · `:a===q.answer?"✅ ":`<span style="color:var(--bad)">❌ Aapka: ${"ABCDE"[a]}. ${esc(O[a])}</span><br>`}<span style="color:var(--ok)">Sahi: ${"ABCDE"[q.answer]}. ${esc(O[q.answer])}</span></p>${q.explain_hi||q.explain?`<p style="margin:6px 0 0;color:var(--muted);white-space:pre-line">${esc(q.explain_hi||q.explain)}</p>`:""}</div>`; }).join("")}</div>
  <div class="row"><button class="btn" data-retake>Dobara dein</button><button class="btn ghost" data-back>Wapas</button></div>`;
}

/* ---------- quiz */
function renderQuiz(){
  const z=S.qz, qs=z.it.questions||[];
  if (z.i>=qs.length) { $("#main").innerHTML=`<div class="card" style="text-align:center"><div style="font-size:56px">🏆</div><h1>${z.score} / ${qs.length} sahi</h1><p>${esc(title(z.it))}</p><div class="row" style="justify-content:center"><button class="btn" data-requiz>Dobara khelein</button><button class="btn ghost" data-back>Wapas</button></div></div>`; return; }
  const q=qs[z.i], O=q.options_hi&&q.options_hi.length?q.options_hi:q.options, done=z.pick!==null;
  $("#main").innerHTML=`<div class="tbar"><button class="back" data-back>✕</button><h2 style="flex:1">${esc(title(z.it))}</h2><span class="chip g">✅ ${z.score}</span></div>
  <div class="card" style="display:flex;flex-direction:column;gap:14px;max-width:760px">
    <div class="prog"><i style="width:${(z.i+1)/qs.length*100}%"></i></div><b>प्रश्न ${z.i+1} / ${qs.length}</b>
    <p class="q" style="white-space:pre-line">${esc(q.q_hi||q.q)}</p>
    <div class="list">${O.map((o,i)=>`<button class="opt ${done&&i===q.answer?"right":""} ${done&&i===z.pick&&i!==q.answer?"wrong":""}" data-qz="${i}"><span class="k">${"ABCDE"[i]}</span>${esc(o)}</button>`).join("")}</div>
    ${done?`<div class="expl" style="white-space:pre-line"><b>${z.pick===q.answer?"Sahi jawab! 🎉":`Galat. Sahi uttar: ${"ABCDE"[q.answer]}. ${esc(O[q.answer])}`}</b>${q.explain_hi||q.explain?`<br>${esc(q.explain_hi||q.explain)}`:""}</div><button class="btn" data-qnext>${z.i<qs.length-1?"Agla prashn →":"Result dekhein"}</button>`:""}
  </div>`;
}

/* ---------- auth */
function loginModal(after){
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="in" role="dialog" aria-label="Login"><h2>Aage badhne ke liye login karein</h2><small style="color:var(--muted)">Ek hi account app aur website dono par chalega</small><div class="err" hidden></div>
  <button class="gbtn" data-g><span class="gdot"></span>Google se login</button>
  <div style="text-align:center;color:var(--muted)">ya Email se</div>
  <input type="text" id="lname" placeholder="Aapka naam (naya account ke liye)" autocomplete="name">
  <input type="email" id="lmail" placeholder="Email" autocomplete="email">
  <input type="password" id="lpass" placeholder="Password (kam se kam 6 akshar)" autocomplete="current-password">
  <div class="row"><button class="btn" data-in style="flex:1">Login</button><button class="btn ghost" data-up style="flex:1">Naya account</button></div>
  <button style="color:var(--brand);font-weight:700" data-reset>Password bhool gaye?</button>
  <button style="color:var(--muted)" data-cancel>Band karein</button></div>`;
  document.body.appendChild(m);
  const err=t=>{ const e=m.querySelector(".err"); e.hidden=false; e.textContent=t; };
  const done=()=>{ m.remove(); after&&after(); };
  const msg=e=>({"auth/invalid-credential":"Email ya password galat hai","auth/wrong-password":"Email ya password galat hai","auth/user-not-found":"Is email se account nahi mila","auth/email-already-in-use":"Is email se account pehle se hai, Login dabayein","auth/weak-password":"Password kam se kam 6 akshar ka rakhein","auth/popup-closed-by-user":"Login window band ho gayi","auth/unauthorized-domain":"Ye website abhi Firebase me allowed nahi hai","auth/operation-not-allowed":"Email login abhi chalu nahi hai"}[e.code]||e.message);
  m.addEventListener("click",async e=>{ const b=e.target.closest("button"); if(!b) return;
    const mail=$("#lmail").value.trim(), pass=$("#lpass").value;
    try{
      if(b.dataset.g!==undefined){ await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); done(); }
      if(b.dataset.in!==undefined){ await auth.signInWithEmailAndPassword(mail,pass); done(); }
      if(b.dataset.up!==undefined){ const c=await auth.createUserWithEmailAndPassword(mail,pass); const n=$("#lname").value.trim(); if(n) await c.user.updateProfile({displayName:n}); done(); }
      if(b.dataset.reset!==undefined){ if(!mail.includes("@")) return err("Pehle email likhein"); await auth.sendPasswordResetEmail(mail); err("Password badalne ka link "+mail+" par bhej diya"); }
      if(b.dataset.cancel!==undefined) m.remove();
    }catch(x){ err(msg(x)); }
  });
}
function renderProfile(){
  const u=S.user;
  $("#main").innerHTML=`<button class="back" data-go="home">← Wapas</button><div class="card row"><span class="av" style="width:56px;height:56px;font-size:24px">${esc((u.displayName||u.email||"?")[0].toUpperCase())}</span><div style="flex:1"><b style="font:700 20px var(--display)">${esc(u.displayName||"Student")}</b><br><small style="color:var(--muted)">${esc(u.email||"")}</small></div></div>
  <div class="list"><a class="li" href="${esc(S.settings.telegramUrl||"https://t.me/examhub2026")}" target="_blank" rel="noopener"><span class="bx">✈️</span><span class="x"><b>Telegram Support</b><small>${esc(S.settings.telegramName||"@examhub2026")}</small></span></a>
  <a class="li" href="https://play.google.com/store/apps/details?id=com.upboardprep" target="_blank" rel="noopener"><span class="bx">📱</span><span class="x"><b>Exam Hub App</b><small>Google Play se download karein</small></span></a>
  <button class="li" data-logout><span class="bx">↩</span><span class="x"><b>Logout</b></span></button></div>`;
}
auth.onAuthStateChanged(u=>{ S.user=u; const a=$("#avatar"); a.textContent=u&&!u.isAnonymous?(u.displayName||u.email||"?")[0].toUpperCase():"?"; });

/* ---------- events */
document.addEventListener("click", e=>{
  const b=e.target.closest("button,a"); if(!b) return; const d=b.dataset;
  if (d.go){ e.preventDefault(); return go(d.go); }
  if (b.id==="avatar") return gated(()=>go("profile"));
  if (d.exam){ S.exam=d.exam; localStorageSet("exam",d.exam); return go("home"); }
  if (d.sec){ const s=S.sections.find(x=>x.id===d.sec); if (s&&s.link) return openUpdate({link:s.link}); return gated(()=>go("section",d.sec)); }
  if (d.dot!==undefined) return setSlide(+d.dot);
  if (d.upd!==undefined) return openUpdate(S.updates[+d.upd]||{});
  if (d.item!==undefined) return openItem(S.items[+d.item]);
  if (d.close!==undefined) return b.closest(".viewer").remove();
  if (d.fs!==undefined){ const v=b.closest(".viewer"); return (v.requestFullscreen?v.requestFullscreen():null); }
  if (d.opt!==undefined){ const r=S.run; if(r.ans[r.cur]===+d.opt) delete r.ans[r.cur]; else r.ans[r.cur]=+d.opt; return renderTest(); }
  if (d.q!==undefined){ S.run.cur=+d.q; return renderTest(); }
  if (d.prev!==undefined){ if(S.run.cur>0) S.run.cur--; return renderTest(); }
  if (d.next!==undefined){ const r=S.run; if(r.cur<r.it.questions.length-1){ r.cur++; return renderTest(); } return confirmSubmit(); }
  if (d.submit!==undefined) return confirmSubmit();
  if (d.exit!==undefined){ clearInterval(tmr); S.run=null; return lastSection ? go("section", lastSection) : go("home"); }
  if (d.retake!==undefined){ const it=S.res.it; S.run={it,ans:{},cur:0,left:(it.minutes||it.questions.length)*60}; startTimer(); return go("test"); }
  if (d.qz!==undefined){ const z=S.qz; if(z.pick!==null) return; z.pick=+d.qz; if(z.pick===z.it.questions[z.i].answer) z.score++; return renderQuiz(); }
  if (d.qnext!==undefined){ S.qz.i++; S.qz.pick=null; return renderQuiz(); }
  if (d.requiz!==undefined){ S.qz={it:S.qz.it,i:0,pick:null,score:0}; return renderQuiz(); }
  if (d.back!==undefined) return lastSection ? go("section", lastSection) : go("home");
  if (d.logout!==undefined){ auth.signOut(); return go("home"); }
});
let lastSection="";
const _go=go; go=function(...v){ if(v[0]==="section") lastSection=v[1]; _go(...v); };
function confirmSubmit(){
  const r=S.run, left=r.it.questions.length-Object.keys(r.ans).length;
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="in"><h2>Test submit karein?</h2><p>${Object.keys(r.ans).length} uttar diye, ${left} chhode.</p><div class="row"><button class="btn" data-yes style="flex:1">Submit</button><button class="btn ghost" data-no style="flex:1">Wapas</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector("[data-yes]").onclick=()=>{ m.remove(); submitTest(); };
  m.querySelector("[data-no]").onclick=()=>m.remove();
}

loadHome().then(()=>go("home")).catch(e=>{ $("#main").innerHTML=`<div class="card"><b>Data load nahi hua</b><p>${esc(e.message)}</p></div>`; });
</script>
</body>
</html>
