name: Avatar video
on:
  workflow_dispatch:
    inputs:
      dir: {required: true}
      chat: {required: true}
      mode: {required: false, default: photo}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q imageio-ffmpeg numpy "opencv-python-headless==4.10.0.84"
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          KEEP: "1"
        run: python3 bot/voice_video.py "${{ inputs.dir }}" "${{ inputs.chat }}"
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: if [ "${{ inputs.mode }}" = loop ]; then python3 bot/avatar_loop.py "${{ inputs.chat }}"; else python3 bot/avatar.py "${{ inputs.chat }}"; fi
