name: Build Exam Hub Phone APK
on:
  workflow_dispatch:
  push:
    paths: ["tools/phone-control/android/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: tools/phone-control/android}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.9"}
      - run: gradle :app:assembleRelease --no-daemon -q
        env: {BUILD_NUM: "${{ github.run_number }}"}
      - name: Release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          cp app/build/outputs/apk/release/app-release.apk ExamHubPhone.apk
          gh release delete phone-control -y --cleanup-tag || true
          gh release create phone-control ExamHubPhone.apk -t "Exam Hub Phone v1.${{ github.run_number }}" -n "Claude se pura phone chalane wala app"
