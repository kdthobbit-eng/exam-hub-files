name: Send file via bot

# Sends a repo file to a Telegram chat with the Exam Hub bot (used by Claude).
on:
  workflow_dispatch:
    inputs:
      path: {description: "File in this repo", required: true}
      chat: {description: "Telegram chat id", required: true}
      caption: {description: "Caption", required: false, default: ""}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          P: ${{ inputs.path }}
          C: ${{ inputs.chat }}
          CAP: ${{ inputs.caption }}
        run: |
          for i in 1 2 3 4 5 6; do
            R=$(curl -sS --max-time 300 -F "chat_id=$C" --form-string "caption=$CAP" -F "document=@$P" "https://api.telegram.org/bot$TOKEN/sendDocument" || true)
            echo "${R:0:200}"
            echo "$R" | grep -q '"ok":true' && exit 0
            sleep 20
          done
          exit 1
