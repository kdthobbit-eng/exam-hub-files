name: Send quiz via bot
on:
  workflow_dispatch:
    inputs:
      file: {description: "quiz/*.json", required: true}
      chat: {description: "Telegram chat id or @username", required: true}
      start: {description: "Start from item index", required: false, default: "0"}
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 bot/send_quiz.py "${{ inputs.file }}" "${{ inputs.chat }}" "${{ inputs.start }}"
