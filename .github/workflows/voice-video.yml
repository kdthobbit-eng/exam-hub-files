name: Voice video
on:
  workflow_dispatch:
    inputs:
      dir: {required: true}
      chat: {required: true}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q imageio-ffmpeg numpy
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 bot/voice_video.py "${{ inputs.dir }}" "${{ inputs.chat }}"
