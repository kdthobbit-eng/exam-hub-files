name: PYQ text extract
on: workflow_dispatch
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-hin >/dev/null
      - run: pip install -q requests
      - run: python pyq/extract_text.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout -b pyq-text
          git add pyq/text && git commit -qm "PYQ text" && git push -f origin pyq-text
