name: Make narrated video
on:
  workflow_dispatch:
    inputs:
      dir: {description: "video/<dir>", required: true}
      chat: {description: "Telegram chat id", required: true}
      voice: {description: "edge-tts voice", required: false, default: "hi-IN-SwaraNeural"}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q edge-tts
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 bot/make_video.py "${{ inputs.dir }}" "${{ inputs.chat }}" "${{ inputs.voice }}"
