name: TTS lines
on:
  workflow_dispatch:
    inputs:
      dir: {description: "video/<dir> containing tts.json", required: true}
      voice: {description: "edge-tts voice", required: false, default: "hi-IN-MadhurNeural"}
      rate: {description: "rate", required: false, default: "+100%"}
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q edge-tts mutagen
      - run: python3 bot/tts_only.py "${{ inputs.dir }}" "${{ inputs.voice }}" "${{ inputs.rate }}"
      - run: |
          git config user.name "Exam Hub Bot" && git config user.email bot@users.noreply.github.com && git add "${{ inputs.dir }}" && git commit -qm "TTS audio" && for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done
